<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冒险王 · Adventure King</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #fbbf24;
    --line: rgba(255, 255, 255, 0.10);
    --text: #e9edf6;
    --muted: #8b93ab;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 14px 22px;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(251, 191, 36, 0.075), transparent 60%),
      radial-gradient(900px 520px at 85% 110%, rgba(56, 189, 248, 0.06), transparent 60%),
      #07070c;
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app { width: 100%; max-width: 1000px; }

  .stage {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #08080e;
    box-shadow:
      0 0 0 1px rgba(251, 191, 36, 0.05),
      0 34px 90px -34px rgba(0, 0, 0, 0.95);
  }

  canvas { display: block; width: 100%; height: auto; background: #08080e; touch-action: none; }

  /* ---------------- 遮罩 ---------------- */
  .overlay {
    position: absolute; inset: 0; display: none; place-items: center; padding: 20px;
    background: radial-gradient(700px 460px at 50% 40%, rgba(8, 9, 15, 0.93), rgba(3, 3, 6, 0.98));
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    text-align: center; animation: fade .22s ease; overflow: auto;
  }
  .overlay.show { display: grid; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .panel { width: 100%; max-width: 800px; animation: rise .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .tag {
    display: inline-block; font-size: 10.5px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.32);
    background: rgba(251, 191, 36, 0.08); border-radius: 999px; padding: 5px 14px; margin-bottom: 12px;
  }

  .panel h1 {
    font-size: clamp(2.3rem, 7.2vw, 3.7rem); font-weight: 900; letter-spacing: 0.05em;
    line-height: 1.05; margin-bottom: 6px;
    background: linear-gradient(100deg, #fde68a, #fbbf24 34%, #fb7185 68%, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.25));
  }
  .sub { font-size: 11px; letter-spacing: 0.46em; color: var(--gold); margin-bottom: 16px; }

  .panel h2 { font-size: clamp(1.3rem, 3.8vw, 1.7rem); font-weight: 800; margin-bottom: 6px; }
  .panel p { color: var(--muted); font-size: 0.88rem; line-height: 1.85; margin-bottom: 10px; }
  .panel p strong { color: #e6ebf5; font-weight: 650; }
  .panel p .gold { color: var(--gold); font-weight: 700; }

  .menu { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 20px; }
  .menu .btn { width: 270px; }

  .btn {
    font-family: inherit; font-size: 0.95rem; font-weight: 700; border: none; border-radius: 999px;
    padding: 12px 30px; cursor: pointer; color: #1a1205;
    background: linear-gradient(100deg, #fbbf24, #fca5a5 55%, #c4b5fd);
    box-shadow: 0 12px 32px -12px rgba(251, 191, 36, 0.65);
    transition: transform .18s, box-shadow .18s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -12px rgba(251, 191, 36, 0.8); }
  .btn:active { transform: translateY(0) scale(0.98); }
  .btn.ghost {
    color: var(--text); background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line); box-shadow: none;
  }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.12); }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

  .keys { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .kbd {
    font-family: "Cascadia Code", "Consolas", monospace; font-size: 11px;
    padding: 2px 7px; border-radius: 5px; color: #e6ebf5;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
    border-bottom-width: 2px;
  }

  /* ---------------- 商店 ---------------- */
  .shop-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .shop-head .left { text-align: left; }
  .shop-head .left b { font-size: 16px; }
  .shop-head .left span { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.14em; }
  .coins {
    font-family: "Cascadia Code", "Consolas", monospace; font-size: 18px; font-weight: 700; color: var(--gold);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .coins i {
    display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 70%, #b45309);
    color: #7c2d12; font-style: normal; font-size: 11px; font-weight: 900;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
  }

  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 12px 0 4px; text-align: left; }

  .shop-item {
    display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); color: var(--text); cursor: pointer;
    background: linear-gradient(180deg, rgba(22, 24, 34, 0.94), rgba(11, 12, 19, 0.92));
    font-family: inherit; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .shop-item:hover:not(.disabled) {
    transform: translateY(-2px); border-color: rgba(251, 191, 36, 0.5);
    box-shadow: 0 14px 30px -18px rgba(251, 191, 36, 0.85);
  }
  .shop-item.disabled { opacity: 0.4; cursor: not-allowed; }
  .shop-item .ico {
    width: 36px; height: 36px; flex: 0 0 36px; display: grid; place-items: center;
    border-radius: 10px; background: rgba(255, 255, 255, 0.06); font-size: 19px;
  }
  .shop-item .info { flex: 1 1 auto; min-width: 0; }
  .shop-item .info b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .shop-item .info span {
    display: block; font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shop-item .price {
    flex: 0 0 auto; font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12.5px; font-weight: 700; color: var(--gold); white-space: nowrap;
  }
  .shop-item.owned { border-color: rgba(74, 222, 128, 0.35); }
  .shop-item.owned .price { color: #4ade80; }

  .stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 2px; font-size: 12px; color: var(--muted); }
  .stats span { padding: 3px 10px; border-radius: 999px; background: rgba(20, 22, 32, 0.9); border: 1px solid var(--line); }
  .stats b { color: #e9edf6; font-family: "Cascadia Code", "Consolas", monospace; }

  /* ---------------- 选职业 ---------------- */
  .cls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 6px; }

  .cls-card {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 16px 12px 14px; border-radius: 14px; cursor: pointer; overflow: hidden;
    font-family: inherit; color: var(--text); text-align: center;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(20, 22, 33, 0.94), rgba(9, 10, 17, 0.92));
    transition: transform .18s, border-color .18s, box-shadow .18s;
  }
  .cls-card::before {
    content: ''; position: absolute; inset: -40% 20% 62% 20%;
    background: radial-gradient(closest-side, var(--c, #fbbf24), transparent);
    opacity: 0.22; pointer-events: none; transition: opacity .18s;
  }
  .cls-card:hover {
    transform: translateY(-4px);
    border-color: var(--c, #fbbf24);
    box-shadow: 0 20px 40px -22px var(--c, #fbbf24);
  }
  .cls-card:hover::before { opacity: 0.4; }
  .cls-card:active { transform: translateY(-1px) scale(0.99); }
  .cls-card .ico { position: relative; font-size: 26px; line-height: 1; margin-bottom: 2px; }
  .cls-card b { position: relative; font-size: 16px; font-weight: 800; letter-spacing: 0.06em; color: var(--c, #fbbf24); }
  .cls-card em { position: relative; font-style: normal; font-size: 11px; color: var(--muted); }
  .cls-card ul {
    position: relative; list-style: none; width: 100%; margin: 8px 0 2px;
    display: flex; flex-direction: column; gap: 3px; font-size: 11px;
  }
  .cls-card ul li {
    display: flex; justify-content: space-between; padding: 2px 8px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.045); font-family: "Cascadia Code", "Consolas", monospace;
  }
  .cls-card ul li span { color: var(--muted); font-family: inherit; }
  .cls-card .sk {
    position: relative; margin-top: 7px; font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; color: var(--c, #fbbf24);
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* ---------------- 横幅 ---------------- */
  .banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
  .banner.show { animation: bannerIn 2.1s ease forwards; }
  .banner b {
    display: block; font-size: clamp(1.5rem, 4.6vw, 2.2rem); font-weight: 900; letter-spacing: 0.08em;
    color: #fff8e7; text-shadow: 0 0 30px rgba(251, 191, 36, 0.85), 0 0 70px rgba(244, 63, 94, 0.45);
  }
  .banner span { display: block; margin-top: 7px; font-size: 0.78rem; letter-spacing: 0.24em; color: #aab4c8; }
  @keyframes bannerIn {
    0% { opacity: 0; transform: scale(0.9); }
    12% { opacity: 1; transform: scale(1); }
    72% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  .hint { text-align: center; font-size: 11.5px; color: #5f6880; margin-top: 12px; line-height: 1.8; }
  .hint b { color: #8b93ab; font-weight: 600; }

  @media (max-width: 660px) {
    .shop-grid { grid-template-columns: 1fr; }
    .cls-grid { grid-template-columns: 1fr; gap: 8px; }
    .cls-card { flex-direction: row; flex-wrap: wrap; justify-content: flex-start; text-align: left; gap: 8px; padding: 10px 12px; }
    .cls-card .ico { font-size: 22px; }
    .cls-card ul { flex-direction: row; width: auto; margin: 0; gap: 4px; }
    .cls-card ul li { gap: 4px; }
    .cls-card .sk { margin: 0 0 0 auto; }
    .hint { display: none; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .overlay, .banner { animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
    <div class="banner" id="banner"></div>
  </div>
  <p class="hint"><b>← →</b> 移动 · <b>↑/空格</b> 跳跃(二段) · <b>J</b> 攻击 · <b>S/↓</b> 护盾 · <b>K L ; O</b> 技能 · <b>E</b> 商人 · <b>B</b> 背包 · <b>P</b> 暂停</p>
</div>

<script>
(function () {
  'use strict';
  // ============================================================
  //  基础
  // ============================================================
  var W = 960, H = 540, GROUND = 470;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var panel = document.getElementById('panel');
  var bannerEl = document.getElementById('banner');

  function fitCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function fmt(n) { return String(Math.round(n)); }

  // ============================================================
  //  音效
  // ============================================================
  var ac = null, soundOn = true;
  function ensureAudio() {
    if (!ac) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { ac = new AC(); } catch (e) { ac = null; } }
    }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!soundOn) return;
    ensureAudio();
    if (!ac) return;
    var t = ac.currentTime;
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  var sfx = {
    swing:  function () { tone(520, 0.07, 'square', 0.03, 300); },
    hit:    function () { tone(240, 0.09, 'square', 0.05, 140); },
    shoot:  function () { tone(760, 0.06, 'sine', 0.028, 980); },
    magic:  function () { tone(600, 0.16, 'triangle', 0.05, 1100); },
    jump:   function () { tone(320, 0.11, 'sine', 0.035, 520); },
    coin:   function () { tone(1040, 0.06, 'sine', 0.04, 1320); },
    hurt:   function () { tone(180, 0.18, 'sawtooth', 0.07, 70); },
    level:  function () { tone(660, 0.16, 'sine', 0.08, 1320); },
    buy:    function () { tone(880, 0.09, 'sine', 0.05, 1180); },
    boss:   function () { tone(110, 0.5, 'sawtooth', 0.09, 60); },
    die:    function () { tone(220, 0.7, 'sawtooth', 0.09, 50); },
    win:    function () { tone(660, 0.2, 'sine', 0.09, 990); },
    portal: function () { tone(400, 0.3, 'sine', 0.05, 900); }
  };

  // ============================================================
  //  职业
  // ============================================================
  var SKILL_UNLOCK_LV = [1, 2, 4, 7];

  // 武器=攻击词条，护甲=防御词条（按职业区分）
  var AFFIX_POOLS = {
    warrior: {
      weapon: [
        { id: 'atk',       name: '锋锐',     stat: 'atk',       min: 2,  max: 8,  color: '#fb923c' },
        { id: 'crit',      name: '暴击',     stat: 'crit',      min: 2,  max: 9,  color: '#fbbf24' },
        { id: 'lifesteal', name: '普攻吸血', stat: 'lifesteal', min: 3,  max: 10, color: '#f43f5e' },
        { id: 'aa_range',  name: '普攻距离', stat: 'aa_range',  min: 8,  max: 26, color: '#fde68a' },
        { id: 'sword_qi',  name: '剑气外放', stat: 'sword_qi',  min: 8,  max: 24, color: '#fdba74' },
        { id: 'spd',       name: '迅捷',     stat: 'spd',       min: 4,  max: 12, color: '#4ade80' }
      ],
      armor: [
        { id: 'def',       name: '坚固',     stat: 'def',       min: 2,  max: 8,  color: '#94a3b8' },
        { id: 'hp',        name: '生命',     stat: 'hp',        min: 16, max: 48, color: '#f87171' },
        { id: 'spd',       name: '迅捷',     stat: 'spd',       min: 4,  max: 14, color: '#4ade80' },
        { id: 'mp',        name: '灵力',     stat: 'mp',        min: 6,  max: 20, color: '#60a5fa' }
      ]
    },
    archer: {
      weapon: [
        { id: 'atk',       name: '锋锐',     stat: 'atk',       min: 2,  max: 8,  color: '#fb923c' },
        { id: 'crit',      name: '暴击',     stat: 'crit',      min: 3,  max: 10, color: '#fbbf24' },
        { id: 'split',     name: '箭矢分裂', stat: 'split',     min: 8,  max: 24, color: '#86efac' },
        { id: 'multishot', name: '连续射击', stat: 'multishot', min: 8,  max: 22, color: '#bef264' },
        { id: 'burn',      name: '灼烧箭',   stat: 'burn',      min: 6,  max: 20, color: '#fb923c' },
        { id: 'chain',     name: '箭矢弹射', stat: 'chain',     min: 8,  max: 22, color: '#67e8f9' },
        { id: 'pierce',    name: '穿透',     stat: 'pierce',    min: 8,  max: 22, color: '#a7f3d0' }
      ],
      armor: [
        { id: 'def',       name: '坚固',     stat: 'def',       min: 2,  max: 7,  color: '#94a3b8' },
        { id: 'hp',        name: '生命',     stat: 'hp',        min: 14, max: 42, color: '#f87171' },
        { id: 'spd',       name: '迅捷',     stat: 'spd',       min: 6,  max: 18, color: '#4ade80' },
        { id: 'mp',        name: '灵力',     stat: 'mp',        min: 6,  max: 18, color: '#60a5fa' }
      ]
    },
    mage: {
      weapon: [
        { id: 'atk',       name: '秘能',     stat: 'atk',       min: 2,  max: 8,  color: '#818cf8' },
        { id: 'crit',      name: '暴击',     stat: 'crit',      min: 2,  max: 9,  color: '#fbbf24' },
        { id: 'cdr',       name: '冷却缩减', stat: 'cdr',       min: 4,  max: 14, color: '#c4b5fd' },
        { id: 'extra_cast',name: '额外释放', stat: 'extra_cast',min: 6,  max: 18, color: '#f0abfc' },
        { id: 'mp',        name: '灵力',     stat: 'mp',        min: 10, max: 30, color: '#60a5fa' }
      ],
      armor: [
        { id: 'def',       name: '坚固',     stat: 'def',       min: 2,  max: 7,  color: '#94a3b8' },
        { id: 'hp',        name: '生命',     stat: 'hp',        min: 14, max: 44, color: '#f87171' },
        { id: 'mana_cost', name: '蓝耗降低', stat: 'mana_cost', min: 5,  max: 16, color: '#60a5fa' },
        { id: 'mp',        name: '灵力',     stat: 'mp',        min: 12, max: 36, color: '#60a5fa' },
        { id: 'spd',       name: '迅捷',     stat: 'spd',       min: 4,  max: 14, color: '#4ade80' }
      ]
    }
  };

  var QNAMES = ['普通','优秀','史诗','传说'];
  var QCOLORS = ['#9ca3af','#60a5fa','#a78bfa','#fbbf24'];
  function qName(q) { return QNAMES[clamp(q, 0, 3)] || QNAMES[0]; }
  function qColor(q) { return QCOLORS[clamp(q, 0, 3)] || QCOLORS[0]; }

  var GEAR_BASE = {
    weapon: {
      warrior: ['铁剑','精钢战斧','秘银重剑','屠龙巨剑'],
      archer:  ['猎弓','复合长弓','秘银神弓','风暴神弓'],
      mage:    ['学徒杖','秘法法杖','贤者之杖','湮灭法杖']
    },
    armor: {
      warrior: ['皮甲','锁子甲','重板甲','龙鳞战甲'],
      archer:  ['皮背心','轻锁甲','游侠战衣','影风战衣'],
      mage:    ['学徒袍','秘法长袍','星辉法袍','贤者圣袍']
    }
  };

  function gearBaseStats(slot, quality) {
    // quality 0灰1蓝2紫3金
    var q = clamp(quality, 0, 3);
    if (slot === 'weapon') return { atk: [4, 11, 22, 38][q], def: 0, hp: 0, mp: 0 };
    return { atk: 0, def: [2, 7, 14, 24][q], hp: [12, 35, 72, 130][q], mp: [0, 8, 18, 32][q] };
  }

  function rollAffixes(quality, count, cls, slot) {
    cls = cls || G.cls || 'warrior';
    slot = slot || 'weapon';
    var cpool = AFFIX_POOLS[cls] || AFFIX_POOLS.warrior;
    var src = cpool[slot] || cpool.weapon || cpool;
    if (!Array.isArray(src)) src = cpool.weapon || [];
    var out = [], pool = src.slice();
    for (var i = 0; i < count && pool.length; i++) {
      var idx = Math.floor(Math.random() * pool.length);
      var a = pool.splice(idx, 1)[0];
      var scale = 1 + clamp(quality, 0, 3) * 0.22; // 品阶越高词条越强（略削弱）
      out.push({ id: a.id, name: a.name, stat: a.stat, color: a.color,
        value: Math.max(1, Math.round(rand(a.min, a.max) * scale)) });
    }
    return out;
  }

  function makeGearDrop(slot, quality, cls) {

  // ============================================================

  function updatePlayer(dt) {
    var c = cdef();
    P.animT += dt;
    if (P.invuln > 0) P.invuln -= dt;
    if (P.hurtT > 0) P.hurtT -= dt;
    if (P.attackT > 0) P.attackT -= dt;
    if (P.attackCd > 0) P.attackCd -= dt;
    if (P.comboWin > 0) P.comboWin -= dt;
    for (var ci = 0; ci < P.cds.length; ci++) if (P.cds[ci] > 0) P.cds[ci] -= dt;
    if (P.castT > 0) P.castT -= dt;
    if (P.quakeT > 0) P.quakeT -= dt;
    if (P.tumbleT > 0) P.tumbleT -= dt;
    if (P.guardT > 0) { P.guardT -= dt; if (P.guardT <= 0) { P.guardT = 0; P.shieldHP = 0; } }
    if (P.shieldCd > 0) P.shieldCd -= dt;
    if (P.attackBuf > 0) P.attackBuf -= dt;
    if (P.jumpBuf > 0) P.jumpBuf -= dt;
    if (P.coyote > 0) P.coyote -= dt;

    // ---- 移动 ----
    var mv = 0;
    if (keys['a'] || keys['arrowleft']) mv -= 1;
    if (keys['d'] || keys['arrowright']) mv += 1;
    var control = P.hurtT > 0 ? 0.25 : 1;
    if (P.spinT > 0) control = 0.65;
    if (P.chargeT > 0) control = 0;
    if (P.tumbleT > 0) control = 0;
    if (P.leapT > 0) control = 0.15;
    if (P.quakeT > 0) control = 0.2;

    var spd = spdVal ? spdVal() : c.spd;
    if (mv !== 0) {
      P.vx = mv * spd * control;
      if (P.spinT <= 0 && P.chargeT <= 0 && P.tumbleT <= 0) P.face = mv;
      P.walkT += dt * (Math.abs(P.vx) / 90);
    } else {
      P.vx *= Math.pow(0.0006, dt);
      if (Math.abs(P.vx) < 6) P.vx = 0;
    }

    // ---- 跳跃 ----
    if (P.jumpBuf > 0) {
      var maxJumps = G.doubleJump ? 2 : 1;
      var canJump = P.jumps < maxJumps && (P.onGround || P.coyote > 0 || P.jumps > 0);
      if (canJump && P.jumps < maxJumps) {
        P.vy = JUMP_V;
        P.jumps++;
        P.onGround = false;
        P.coyote = 0;
        P.jumpBuf = 0;
        sfx.jump();
        spawnParticles(P.x + P.w / 2, P.y + P.h, 5, 'rgba(255,255,255,0.7)', 60);
      }
    }
    if (!P.jumpHeld && P.vy < -220) P.vy *= Math.pow(0.02, dt * 8);

    // ---- 攻击 ----
    if (P.attackBuf > 0 && P.attackCd <= 0 && P.spinT <= 0 && P.chargeT <= 0 && P.quakeT <= 0) {
      P.attackBuf = 0;
      doAttack();
    }

    // ---- 冲锋斩 ----
    if (P.chargeT > 0) {
      P.chargeT -= dt;
      P.vx = P.chargeDir * 800;
      P.chargeTick -= dt;
      if (P.chargeTick <= 0) {
        P.chargeTick = 0.05;
        var cmul = skillMul();
        var cbox = { x: P.x - 14, y: P.y - 30, w: P.w + 28, h: P.h + 36 };
        var hitAny = false;
        eachMonster(function (m) {
          if (!m || m.dead || P.chargeHit.indexOf(m) >= 0) return;
          if (overlap(cbox, m)) {
            P.chargeHit.push(m);
            hurtMonster(m, atkVal() * 1.7 * cmul, P.chargeDir, '#fdba74');
            spawnParticles(m.x + m.w / 2, m.y + m.h / 2, 8, '#fdba74', 240);
            hitAny = true;
          }
        });
        if (G.boss && P.chargeHit.indexOf(G.boss) < 0 && overlap(cbox, G.boss)) {
          P.chargeHit.push(G.boss);
          hurtBoss(atkVal() * 1.7 * cmul, P.chargeDir, '#fdba74');
          hitAny = true;
        }
        if (hitAny) G.shake = Math.max(G.shake, 9);
        else if (Math.random() < 0.5) spawnParticles(P.x + P.w / 2, P.y + P.h - 4, 2, '#fdba74', 90);
      }
      if (P.chargeT <= 0) P.vx *= 0.25;
    }

    // ---- 剑刃风暴 / 旋转 ----
    if (P.spinT > 0) {
      P.spinT -= dt;
      P.spinTick -= dt;
      if (P.spinTick <= 0) {
        P.spinTick = 0.10;
        var mul = skillMul();
        var cx = P.x + P.w / 2, cy = P.y + P.h / 2;
        var sr = 135;
        eachMonster(function (m) {
          var mx = m.x + m.w / 2, my = m.y + m.h / 2;
          var d = dist(cx, cy, mx, my);
          if (d < sr + Math.max(m.w, m.h) * 0.4) {
            hurtMonster(m, atkVal() * 0.52 * mul, (mx - cx) >= 0 ? 1 : -1, '#fbbf24', { noSplit: true, noExplode: true });
            m.kx += (mx < cx ? -1 : 1) * 30;
          }
        });
        if (G.boss && dist(cx, cy, G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2) < sr + Math.max(G.boss.w, G.boss.h) * 0.4) {
          hurtBoss(atkVal() * 0.52 * mul, (G.boss.x + G.boss.w / 2) >= cx ? 1 : -1, '#fbbf24', { noSplit: true, noExplode: true });
        }
        G.shake = Math.max(G.shake, 3);
      }
      if (Math.random() < 0.7) spawnParticles(P.x + P.w / 2 + rand(-50, 50), P.y + rand(4, 44), 2, '#fbbf24', 140);
      if (P.spinT <= 0) P.spinT = 0;
    }

    // ---- 疾影翻滚 ----
    if (P.tumbleT > 0) {
      P.vx = P.chargeDir * 560;
      if (Math.random() < 0.5) spawnParticles(P.x + P.w / 2, P.y + P.h - 6, 2, '#34d399', 90);
    }

    // ---- 审判跳斩 ----
    if (P.leapT > 0) {
      P.leapT -= dt;
      var lx = P.leapX + P.w / 2 - (P.x + P.w / 2);
      P.vx = clamp(lx * 6, -520, 520);
      if (lx !== 0) P.face = lx > 0 ? 1 : -1;
      if ((P.leapT <= 0 || P.onGround) && P.leapT < 0.46) {
        P.leapT = 0;
        var lmul = skillMul();
        var ldmg = atkVal() * 1.8 * lmul; // 辅助控制
        var lcx = P.x + P.w / 2;
        eachMonster(function (m) {
          if (dist(lcx, GROUND, m.x + m.w / 2, m.y + m.h / 2) < 210) {
            var cr = Math.random() < critChance();
            hurtMonster(m, ldmg * (cr ? 1.4 : 1), (m.x > lcx ? 1 : -1), '#f97316', { noSplit: true });
            if (m.kind !== 'fly') m.vy = -260;
            m.slowT = Math.max(m.slowT, 1.5);
          }
        });
        if (G.boss && dist(lcx, GROUND, G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2) < 230) hurtBoss(ldmg, 0, '#f97316', { noSplit: true });
        addZone({ type: 'quake', x: lcx, y: GROUND - 8, r: 220, t: 0.5, max: 0.5, color: '#f97316' });
        addZone({ type: 'ring', x: lcx, y: GROUND - 6, r: 190, t: 0.4, max: 0.4, color: '#fbbf24' });
        spawnParticles(lcx, GROUND - 20, 28, '#f97316', 320);
        G.shake = Math.max(G.shake, 14); sfx.hit();
      }
    }

    // ---- 物理 ----
    P.x += P.vx * dt;
    if (G.bossActive) P.x = Math.max(P.x, G.barrierX + 8);
    if (G.waveLockX && !G.bossActive) P.x = Math.min(P.x, G.waveLockX - P.w - 8);
    P.x = clamp(P.x, 8, G.worldLen - P.w - 8);

    var prevBottom = P.y + P.h;
    P.vy += GRAV * dt;
    if (P.vy > 1250) P.vy = 1250;
    P.y += P.vy * dt;

    var wasGround = P.onGround;
    P.onGround = false;

    // 浮空平台（单向）
    if (P.vy >= 0) {
      for (var i = 0; i < PL.length; i++) {
        var pl = PL[i];
        if (P.x + P.w > pl.x + 2 && P.x < pl.x + pl.w - 2 &&
            prevBottom <= pl.y + 6 && P.y + P.h >= pl.y) {
          P.y = pl.y - P.h;
          P.vy = 0;
          P.onGround = true;
        }
      }
    }

    // 地面
    if (P.y + P.h >= GROUND) {
      P.y = GROUND - P.h;
      P.vy = 0;
      P.onGround = true;
    }

    if (P.onGround) {
      P.jumps = 0;
      P.coyote = 0.1;
      if (!wasGround) spawnParticles(P.x + P.w / 2, P.y + P.h, 6, 'rgba(200,200,210,0.55)', 80);
    }

    // ---- 蓝量回复 ----
    var mpRegen = (3.2 + G.level * 0.12);
    if (G.cls === 'mage') mpRegen = (8.5 + G.level * 0.55);
    else if (G.cls === 'archer') mpRegen = (4.2 + G.level * 0.18);
    else if (G.cls === 'warrior') mpRegen = (2.0 + G.level * 0.08);
    G.mp = Math.min(maxMp(), G.mp + mpRegen * dt);
    if (P.comboWin <= 0) P.comboHits = 0;

    // ---- 技能输入 ----
    if (P.skillBuf >= 0) {
      var si = P.skillBuf;
      P.skillBuf = -1;
      useSkill(si);
    }
  }

  function aimDir(speed) {
    var px = P.x + P.w / 2, py = P.y + P.h * 0.45;
    var best = null, bestD = 1e9;

    function consider(tx, ty) {
      var dx = tx - px;
      if (dx * P.face < -24) return;
      var d = Math.abs(dx) + Math.abs(ty - py) * 0.6;
      if (d < bestD) { bestD = d; best = { x: tx, y: ty }; }
    }

    eachMonster(function (m) {
      consider(m.x + m.w / 2, m.y + m.h / 2);
    });
    if (G.boss) consider(G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2);

    if (best && bestD < 720) {
      var a = Math.atan2(best.y - py, best.x - px);
      return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed };
    }
    return { vx: P.face * speed, vy: 0 };
  }

  function doAttack() {
    var c = cdef();
    P.attackCd = c.atkSpeed;
    P.combo = P.comboWin > 0 ? (P.combo + 1) % 3 : 0;
    P.comboWin = 0.65;
    P.attackT = G.cls === 'warrior' ? 0.22 : 0.2;
    P.comboHits = (P.comboHits || 0) + 1;

    if (G.cls === 'warrior') {
      // 战士：远距横扫，安全输出（射手才是普攻主C）
      var mul = 1.18 + P.combo * 0.22;
      var crit = Math.random() < critChance();
      var dmg = atkVal() * mul * (crit ? 1.6 : 1) * rand(0.95, 1.06);
      var reach = 122 + P.combo * 8 + (equipStat('aa_range') || 0);
      var box = { x: P.face > 0 ? P.x + P.w - 4 : P.x - reach + 4, y: P.y - 6, w: reach, h: P.h + 10 };
      var hitAny = false;
      eachMonster(function (m) {
        if (overlap(box, m)) {
          hurtMonster(m, dmg, P.face, crit ? '#fbbf24' : '#fff3c4', { fromAA: true });
          if (m.kind !== 'fly' && P.combo === 2) m.vy = Math.min(m.vy, -140);
          hitAny = true;
        }
      });
      if (G.boss && overlap(box, G.boss)) {
        hurtBoss(dmg, P.face, crit ? '#fbbf24' : '#fff3c4', { fromAA: true });
        hitAny = true;
      }
      SW.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, face: P.face, t: 0.18, max: 0.18, combo: P.combo });
      // 终结段前方气浪（随距离延伸）
      if (P.combo === 2) {
        var ww = 76 + (equipStat('aa_range') || 0) * 0.5;
        var wb = { x: P.face > 0 ? P.x + P.w + 8 : P.x - ww - 8, y: P.y + 6, w: ww, h: P.h - 8 };
        eachMonster(function (m) {
          if (overlap(wb, m)) hurtMonster(m, atkVal() * 0.5, P.face, '#fde68a', { noSplit: true, noExplode: true, fromAA: true });
        });
        if (G.boss && overlap(wb, G.boss)) hurtBoss(atkVal() * 0.5, P.face, '#fde68a', { noSplit: true, noExplode: true, fromAA: true });
      }
      // 普攻释放剑气（装备词条）
      var qi = equipStat('sword_qi') || 0;
      if (qi > 0) {
        spawnShot({ x: P.x + P.w / 2 + P.face * 34, y: P.y + P.h * 0.45,
          vx: P.face * (560 + qi * 6), vy: 0,
          dmg: atkVal() * (0.55 + qi * 0.012) * (crit ? 1.4 : 1),
          friendly: true, kind: 'pierce', life: 0.95, w: 44, h: 22,
          pierce: true, fromAA: true, noSplit: true });
      }
      if (hitAny) G.shake = Math.max(G.shake, 2.5 + P.combo);
      sfx.swing();
    } else if (G.cls === 'archer') {
      // 射手：普攻为主，高频高伤
      var ad = aimDir(760);
      var multi = (equipStat('multishot') || 0) >= 18 ? 2 : ((equipStat('multishot') || 0) >= 8 ? 1 : 0);
      var pierceLv = equipStat('pierce') || 0;
      var burnLv = equipStat('burn') || 0;
      var chainLv = equipStat('chain') || 0;
      function fireArrow(vx, vy, dmgMul, delay) {
        var fire = function () {
          if (!P || G.mode !== 'playing') return;
          spawnShot({
            x: P.x + P.w / 2 + P.face * 20, y: P.y + 22,
            vx: vx, vy: vy,
            dmg: Math.max(3, Math.round((34 * (1 + G.stageIndex * 0.35) * rand(0.2, 0.25)) * (1 + equipStat('atk') * 0.06 + G.atkBonus * 0.03 + G.level * 0.02) * (dmgMul || 1))), friendly: true, kind: 'arrow', life: 1.6, w: 18, h: 14,
            fromAA: true, pierce: pierceLv >= 12, burn: burnLv, chain: chainLv,
            bouncesLeft: chainLv >= 20 ? 3 : (chainLv >= 10 ? 2 : (chainLv > 0 ? 1 : 0))
          });
        };
        if (delay) setTimeoutSafe(delay, fire); else fire();
      }
      fireArrow(ad.vx, ad.vy, 1, 0);
      if (multi >= 1) {
        var a1 = Math.atan2(ad.vy, ad.vx) + 0.11;
        fireArrow(Math.cos(a1) * 760, Math.sin(a1) * 760, 0.72, 55);
      }
      if (multi >= 2) {
        var a2 = Math.atan2(ad.vy, ad.vx) - 0.11;
        fireArrow(Math.cos(a2) * 760, Math.sin(a2) * 760, 0.72, 110);
      }
      sfx.shoot();
    } else {
      // 法师：普攻较弱，主要靠技能输出
      var md = aimDir(440);
      spawnShot({
        x: P.x + P.w / 2 + P.face * 20, y: P.y + 22,
        vx: md.vx, vy: md.vy,
        dmg: atkVal() * 0.42 * rand(0.94, 1.06), friendly: true, kind: 'bolt', life: 1.2, w: 16, h: 16
      });
      sfx.magic();
    }
  }

  function targetList(x, y, maxD) {
    var out = [];
    for (var i = 0; i < M.length; i++) {
      var m = M[i];
      if (!m || m.dead) continue;
      var tx = m.x + m.w / 2, ty = m.y + m.h / 2;
      var d = dist(x, y, tx, ty);
      if (d <= maxD) out.push({ x: tx, y: ty, ref: m, boss: false, d: d });
    }
    if (G.boss) {
      var bx = G.boss.x + G.boss.w / 2, by = G.boss.y + G.boss.h / 2;
      var bd = dist(x, y, bx, by);
      if (bd <= maxD) out.push({ x: bx, y: by, ref: G.boss, boss: true, d: bd });
    }
    out.sort(function (a, b) { return a.d - b.d; });
    return out;
  }

  function pickLockTarget(x, y, maxD, front) {
    var list = targetList(x, y, maxD);
    if (!list.length) return null;
    if (front) {
      for (var i = 0; i < list.length; i++) {
        if ((list[i].x - x) * P.face >= -40) return list[i];
      }
    }
    return list[0];
  }

  function useSkill(i) {
    if (!P || G.mode !== 'playing') return;
    i = (i === undefined || i === null) ? 0 : i;
    var sk = cdef().skills[i];
    if (!sk) return;
    if (!skillUnlocked(i)) { toast('Lv.' + sk.unlock + ' 解锁', '#94a3b8'); return; }
    if (P.cds[i] > 0) return;
    var cost = sk.mp;
    if (G.cls === 'mage') cost = Math.max(1, Math.round(sk.mp * (1 - Math.min(0.6, (equipStat('mana_cost') || 0) * 0.01))));
    if (G.mp < cost) { toast('蓝量不足', '#60a5fa'); return; }
    G.mp -= cost;
    var cd = sk.cd;
    if (G.cls === 'mage') cd = sk.cd * (1 - Math.min(0.55, (equipStat('cdr') || 0) * 0.01));
    P.cds[i] = Math.max(0.4, cd);
    P.castT = 0.22;

    var mul = skillMul();
    if (G.cls === 'mage') mul *= 1.08; // 法师技能主导
    var cx = P.x + P.w / 2, cy = P.y + P.h / 2;
    var extraCast = (G.cls === 'mage' && !sk.survival && (equipStat('extra_cast') || 0) > 0 && Math.random() < Math.min(0.55, (equipStat('extra_cast') || 0) * 0.01));

    // ===== 射手：箭雨（保留，自动锁敌）=====
    if (sk.id === 'rain') {
      var rl = pickLockTarget(cx, cy, 760, true);
      ZN.push({
        type: 'rain',
        x: rl ? rl.x : clamp(cx + P.face * 215, 120, G.worldLen - 120),
        w: 360, t: 1.35, max: 1.35, tick: 0, mul: mul,
        lock: rl ? rl.ref : null, lockBoss: rl ? rl.boss : false
      });
      sfx.magic(); G.shake = Math.max(G.shake, 4);

    // ===== 战士 =====
    } else if (sk.id === 'earthsplit') {
      var ed = P.face;
      var ebox = { x: ed > 0 ? P.x + 10 : P.x - 320, y: GROUND - 90, w: 340, h: 90 };
      var edmg = atkVal() * 1.6 * mul; // 辅助输出，普攻为主
      eachMonster(function (m) {
        if (overlap(ebox, m)) {
          var crit = Math.random() < critChance();
          hurtMonster(m, edmg * (crit ? 1.5 : 1), ed, crit ? '#fbbf24' : '#fb923c', { noSplit: true });
          if (m.kind !== 'fly') { m.vy = -320; m.kx += ed * 200; }
        }
      });
      if (G.boss && overlap(ebox, G.boss)) { hurtBoss(edmg, ed, '#fb923c', { noSplit: true }); }
      addZone({ type: 'quake', x: cx + ed * 130, y: GROUND - 8, r: 300, t: 0.55, max: 0.55, color: '#fb923c' });
      for (var ei = 0; ei < 4; ei++) spawnParticles(cx + ed * rand(30, 300), GROUND - rand(4, 36), 10, '#fb923c', 280);
      G.shake = Math.max(G.shake, 10); sfx.hit();

    } else if (sk.id === 'warcry') {
      P.guardT = 3.2;
      P.shieldHP = Math.max(P.shieldHP, Math.round(maxHp() * 0.3 + defVal() * 7));
      P.invuln = Math.max(P.invuln, 0.7);
      var heal = Math.round(maxHp() * 0.14);
      G.hp = Math.min(maxHp(), G.hp + heal);
      addNum(cx, P.y - 10, '护盾 +' + Math.round(P.shieldHP), '#93c5fd', 15);
      addNum(cx, P.y - 30, '+' + heal, '#4ade80', 13);
      eachMonster(function (m) {
        if (dist(cx, cy, m.x + m.w / 2, m.y + m.h / 2) < 160) { m.kx += (m.x > cx ? 1 : -1) * 260; m.slowT = Math.max(m.slowT, 1.2); }
      });
      addZone({ type: 'nova', x: cx, y: cy, t: 0.45, max: 0.45, maxR: 170, c1: '#93c5fd', c2: '#60a5fa' });
      G.shake = Math.max(G.shake, 6); sfx.level();

    } else if (sk.id === 'whirlstorm') {
      P.spinT = 1.1; P.spinTick = 0; P.invuln = Math.max(P.invuln, 1.15);
      G.shake = Math.max(G.shake, 5); sfx.swing();

    } else if (sk.id === 'leap') {
      var lt = pickLockTarget(cx, cy, 520, true);
      P.leapT = 0.52;
      P.leapX = lt ? clamp(lt.x - P.w / 2, 20, G.worldLen - P.w - 20) : clamp(cx + P.face * 220 - P.w / 2, 20, G.worldLen - P.w - 20);
      P.leapY = GROUND - P.h;
      P.vy = -520; P.onGround = false; P.invuln = Math.max(P.invuln, 0.55);
      sfx.jump();

    // ===== 射手 =====
    } else if (sk.id === 'tumble') {
      P.tumbleT = 0.28;
      P.chargeDir = P.face; // reuse dir
      P.vx = P.face * 560; P.vy = Math.min(P.vy, -120);
      P.invuln = Math.max(P.invuln, 0.45);
      spawnParticles(cx, cy, 10, '#34d399', 180);
      sfx.shoot();

    } else if (sk.id === 'snipe') {
      var st = pickLockTarget(cx, cy, 1100, false);
      var sdir = st ? Math.atan2(st.y - (P.y + 22), st.x - cx) : (P.face > 0 ? 0 : Math.PI);
      var svx = Math.cos(sdir) * 1320, svy = Math.sin(sdir) * 1320;
      var sdmg = atkVal() * 3.6 * mul * (1 + critChance() * 0.6);
      // 贯穿多个目标：pierce=true + hitList，足够的life/宽判定
      spawnShot({ x: cx + Math.cos(sdir) * 22, y: P.y + 22, vx: svx, vy: svy,
        dmg: sdmg, friendly: true, kind: 'snipe', life: 1.5, w: 52, h: 26, pierce: true });
      G.shake = Math.max(G.shake, 5); sfx.shoot();
      addZone({ type: 'ring', x: cx, y: P.y + 22, r: 60, t: 0.2, max: 0.2, color: '#86efac' });

    } else if (sk.id === 'volley') {
      var base = P.face > 0 ? 0 : Math.PI;
      for (var vi = 0; vi < 7; vi++) (function (idx) {
        var a = base + (idx - 3) * 0.13;
        setTimeoutSafe(idx * 55, function () {
          if (!P || G.mode !== 'playing') return;
          spawnShot({ x: P.x + P.w / 2 + Math.cos(a) * 18, y: P.y + 20,
            vx: Math.cos(a) * 760, vy: Math.sin(a) * 760,
            dmg: atkVal() * 0.95 * mul, friendly: true, kind: 'arrow', life: 1.5, w: 18, h: 14 });
          sfx.shoot();
        });
      })(vi);
      G.shake = Math.max(G.shake, 4);

    // ===== 法师 =====
    } else if (sk.id === 'frostlance') {
      var fd = aimDir(940);
      spawnShot({ x: cx + P.face * 20, y: P.y + 22, vx: fd.vx, vy: fd.vy,
        dmg: atkVal() * 6.4 * mul + 14, friendly: true, kind: 'frost', life: 1.55, w: 38, h: 22, pierce: true, slow: 2.6 });
      if (extraCast) {
        var fd2 = aimDir(920);
        spawnShot({ x: cx + P.face * 20, y: P.y + 28, vx: fd2.vx, vy: fd2.vy,
          dmg: atkVal() * 3.8 * mul + 8, friendly: true, kind: 'frost', life: 1.4, w: 30, h: 18, pierce: true, slow: 1.8, noExplode: true });
        addNum(cx, P.y - 18, '额外释放!', '#a5f3fc', 13);
      }
      sfx.magic();

    } else if (sk.id === 'blink') {
      var bx = clamp(cx + P.face * 220, 30, G.worldLen - 30);
      spawnParticles(cx, cy, 14, '#818cf8', 200);
      P.x = bx - P.w / 2; P.y = Math.min(P.y, GROUND - P.h);
      P.vx = P.face * 120; P.vy = Math.min(P.vy, -60);
      P.invuln = Math.max(P.invuln, 0.55);
      spawnParticles(P.x + P.w / 2, P.y + P.h / 2, 16, '#c4b5fd', 220);
      addZone({ type: 'nova', x: cx, y: cy, t: 0.25, max: 0.25, maxR: 80, c1:'#818cf8', c2:'#c4b5fd' });
      sfx.portal();

    } else if (sk.id === 'firestorm') {
      var fl = pickLockTarget(cx, cy, 720, true);
      ZN.push({ type: 'firestorm',
        x: fl ? fl.x : clamp(cx + P.face * 240, 120, G.worldLen - 120),
        y: GROUND, w: 250, t: extraCast ? 3.4 : 2.9, max: extraCast ? 3.4 : 2.9, tick: 0, mul: mul * 1.12,
        lock: fl ? fl.ref : null, lockBoss: fl ? fl.boss : false });
      if (extraCast) addNum(cx, P.y - 18, '额外释放!', '#fb923c', 13);
      sfx.magic(); G.shake = Math.max(G.shake, 4);

    } else if (sk.id === 'thunder') {
      var tl = pickLockTarget(cx, cy, 820, false);
      var tx = tl ? tl.x : clamp(cx + P.face * 260, 120, G.worldLen - 120);
      var strikes = extraCast ? 7 : 5;
      if (extraCast) addNum(cx, P.y - 18, '额外释放!', '#fde68a', 13);
      for (var ti = 0; ti < strikes; ti++) (function (idx) {
        setTimeoutSafe(idx * 150, function () {
          if (G.mode !== 'playing') return;
          var sx = tx + rand(-55, 55);
          var tdmg = atkVal() * 3.8 * mul + 10;
          ZN.push({ type: 'bolt_strike', x: sx, y: GROUND, t: 0.38, max: 0.38, dmg: tdmg });
          var topts = { noSplit: true, noExplode: true, noCombo: true };
          eachMonster(function (m) {
            if (Math.abs((m.x + m.w / 2) - sx) < 95) { hurtMonster(m, tdmg, 0, '#fde68a', topts); m.slowT = Math.max(m.slowT, 2.0); }
          });
          if (G.boss && Math.abs((G.boss.x + G.boss.w / 2) - sx) < 115) hurtBoss(tdmg, 0, '#fde68a', topts);
          spawnParticles(sx, GROUND - 60, 18, '#fde68a', 320);
          G.shake = Math.max(G.shake, 9); sfx.hit();
        });
      })(ti);
    }
  }

  function setTimeoutSafe(ms, fn) {
    // rAF-based delay (no setTimeout dependency issues in some contexts; works fine in browser)
    var start = performance.now();
    function tick(now) {
      if (now - start >= ms) { fn(); return; }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function playerProcStats() {
    return {
      lifesteal: equipStat('lifesteal') || 0,
      combo: equipStat('combo') || 0,
      split: equipStat('split') || 0,
      explode: equipStat('explode') || 0
    };
  }

  function applyLifesteal(dealt) {
    var ls = equipStat('lifesteal') || 0;
    if (ls <= 0 || dealt <= 0) return;
    var heal = dealt * ls * 0.01;
    if (heal < 0.5) return;
    G.hp = Math.min(maxHp(), G.hp + heal);
    if (Math.random() < 0.35) addNum(P.x + P.w / 2, P.y - 28, '+' + fmt(heal), '#f43f5e', 11);
  }

  function procOnHit(x, y, dealt, opts) {
    opts = opts || {};
    var ps = playerProcStats();
    if (!P || G.mode !== 'playing') return;
    // 连击：额外追加伤害
    if (!opts.noCombo && ps.combo > 0 && dealt > 0) {
      P.comboHits = (P.comboHits || 0) + 1;
      var cChance = Math.min(0.75, ps.combo * 0.01 + Math.min(P.comboHits, 8) * 0.02);
      if (Math.random() < cChance) {
        var extra = dealt * (0.35 + ps.combo * 0.008);
        var nt = nearestTarget(x, y, 220);
        if (nt) {
          if (nt.boss) hurtBoss(extra, (nt.x > x ? 1 : -1), '#fde68a', { noCombo: true, noSplit: true, shallow: true });
          else hurtMonster(nt.ref, extra, (nt.x > x ? 1 : -1), '#fde68a', { noCombo: true, noSplit: true, shallow: true });
          spawnParticles(x, y, 4, '#fde68a', 120);
        }
      }
    } else if (opts.noCombo) { /* keep streak */ }
    // 分裂：生成分裂碎片（不再分裂/不再爆炸，避免递归）
    if (!opts.noSplit && ps.split > 0 && Math.random() < Math.min(0.7, ps.split * 0.01)) {
      var n = ps.split >= 18 ? 3 : 2;
      var baseA = rand(0, Math.PI * 2);
      for (var i = 0; i < n; i++) {
        var a = baseA + (Math.PI * 2 * i / n) + rand(-0.25, 0.25);
        spawnShot({ x: x, y: y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520,
          dmg: Math.max(1, dealt * 0.38), friendly: true, kind: 'split', life: 0.55, w: 14, h: 14,
          pierce: false, noSplit: true, noExplode: true, shallow: true });
      }
      spawnParticles(x, y, 5, '#86efac', 140);
    }
    // 爆炸：范围爆炸（爆炸不再触发爆炸词条）
    if (!opts.noExplode && ps.explode > 0 && Math.random() < Math.min(0.65, ps.explode * 0.01)) {
      explodeAt(x, y, 70 + ps.explode * 1.8, Math.max(1, dealt * (0.45 + ps.explode * 0.006)), { noExplode: true, shallow: true });
    }
  }

  function explodeAt(x, y, radius, dmg, opts) {
    opts = opts || {};
    var total = 0;
    eachMonster(function (m) {
      if (dist(x, y, m.x + m.w / 2, m.y + m.h / 2) < radius + Math.max(m.w, m.h) * 0.3) {
        total += hurtMonster(m, dmg * 0.85, (m.x + m.w / 2) >= x ? 1 : -1, '#fdba74', opts) || 0;
      }
    });
    if (G.boss && dist(x, y, G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2) < radius + G.boss.w * 0.35) {
      total += hurtBoss(dmg * 0.85, (G.boss.x + G.boss.w / 2) >= x ? 1 : -1, '#fdba74', opts) || 0;
    }
    addZone({ type: 'burst', x: x, y: y, r: radius, t: 0.35, max: 0.35, color: '#fb923c' });
    spawnParticles(x, y, 18, '#fb923c', 250);
    G.shake = Math.max(G.shake, 5);
    sfx.hit();
    return total;
  }

  // ============================================================
  //  受伤 / 经验
  // ============================================================
  function hurtPlayer(amount) {
    if (!P || G.mode !== 'playing' || P.invuln > 0) return;
    var d = Math.max(1, amount - defVal() * 0.46) * rand(0.92, 1.12);
    if (P.shieldHP > 0) {
      var absorbed = Math.min(P.shieldHP, d);
      P.shieldHP -= absorbed;
      d -= absorbed;
      addNum(P.x + P.w / 2, P.y - 22, '格挡 ' + fmt(absorbed), '#93c5fd', 13);
      spawnParticles(P.x + P.w / 2, P.y + P.h / 2, 6, '#93c5fd', 150);
      if (P.shieldHP <= 0) { P.shieldHP = 0; if (P.guardT > 0.6) P.guardT = 0.6; }
      if (d <= 0.5) { G.shake = Math.max(G.shake, 3); return; }
    }
    G.hp -= d;
    P.invuln = 0.65;
    P.hurtT = 0.32;
    P.vx = -P.face * 170;
    P.vy = -165;
    G.flash = 0.28;
    G.shake = Math.max(G.shake, 7);
    addNum(P.x + P.w / 2, P.y - 4, '-' + fmt(d), '#fb7185', 16);
    spawnParticles(P.x + P.w / 2, P.y + P.h / 2, 10, '#fb7185', 200);
    sfx.hurt();
    if (G.hp <= 0) { G.hp = 0; gameOver(); }
  }

  function gainXp(v) {
    G.xp += v;
    while (G.xp >= G.xpNext) {
      G.xp -= G.xpNext;
      levelUp();
    }
  }

  function levelUp() {
    G.level++;
    G.xpNext = Math.round(38 + G.level * 26);
    var mh = maxHp();
    G.hp = Math.min(mh, G.hp + mh * 0.4);
    G.mp = Math.min(maxMp(), G.mp + maxMp() * 0.4);
    sfx.level();
    addNum(P.x + P.w / 2, P.y - 12, 'LEVEL UP', '#fbbf24', 17);
    spawnParticles(P.x + P.w / 2, P.y + P.h / 2, 26, '#fbbf24', 220);
    banner('升级！Lv.' + G.level, '生命 / 攻击 提升');
  }

  // ============================================================
  //  相机 / BOSS / 过关
  // ============================================================
  function updateCamera(dt) {
    var target = G.bossActive ? (G.worldLen - W) : (P.x + P.w / 2 - W * 0.42);
    var maxCam = G.worldLen - W;
    if (G.waveLockX && !G.bossActive) maxCam = Math.min(maxCam, Math.max(0, G.waveLockX - W + 60));
    target = clamp(target, 0, maxCam);
    G.camX = lerp(G.camX, target, 1 - Math.pow(0.0009, dt));
  }

  function updateWaves(dt) {
    if (!P || G.bossActive || G.portal) return;
    if (!G.waves || !G.waves.length) return;

    // spawn/activate next wave
    if (G.waveCur < 0 || (G.waves[G.waveCur] && G.waves[G.waveCur].cleared)) {
      var next = G.waveCur + 1;
      if (next < G.waves.length) {
        var wv = G.waves[next];
        if (P.x + W * 0.35 > wv.trigger || P.x > wv.left - 220) {
          G.waveCur = next;
          wv.spawned = true;
          wv.cleared = false;
          G.waveLockX = Math.min(wv.right, G.barrierX - 40);
          if (wv.mobs) {
            for (var i = 0; i < wv.mobs.length; i++) spawnMonster(wv.mobs[i].type, wv.mobs[i].x, wv.i);
          }
          toast('怪物来袭！清除后前进', '#f87171');
        }
      }
    }

    // check clear
    if (G.waveCur >= 0 && G.waves[G.waveCur] && !G.waves[G.waveCur].cleared) {
      var alive = false;
      for (var j = 0; j < M.length; j++) { if (M[j].waveId === G.waves[G.waveCur].i) { alive = true; break; } }
      if (!alive) {
        G.waves[G.waveCur].cleared = true;
        G.waveLockX = 0;
        toast('区域清除！继续前进', '#4ade80');
        sfx.portal();
      }
    }
  }

  function updateStageFlow(dt) {
    updateWaves(dt);
    if (!G.bossActive && !G.portal && P.x > G.barrierX - 30) startBoss();

    if (G.portal) {
      G.portal.t += dt;
      if (Math.abs((P.x + P.w / 2) - G.portal.x) < 52 && G.completeT <= 0) {
        G.completeT = 0.01;
      }
      if (G.portal.t > 7 && G.completeT <= 0) G.completeT = 0.01;
      if (G.completeT > 0) {
        G.completeT -= dt;
        if (G.completeT <= 0) completeStage();
      }
    }
  }

  function startBoss() {
    var b = BOSSES[G.stage.boss];
    G.bossActive = true;
    G.boss = {
      type: G.stage.boss, name: b.name,
      x: G.worldLen - 240, y: GROUND - b.h, w: b.w, h: b.h,
      hp: b.hp, maxHp: b.hp, atk: b.atk, def: b.def,
      face: -1, vx: 0, vy: 0, onGround: true,
      t: 0, timer: 1.4, state: 'idle', stateT: 0,
      flash: 0, hurtT: 0, dead: false, phase: 1, contactCd: 0
    };
    G.shake = 10;
    sfx.boss();
    banner('BOSS · ' + b.name, '击败它，前往下一关');
    G.barrierX = G.worldLen - 860;
  }

  function bossDied() {
    var b = G.boss;
    G.bossActive = false;
    G.boss = null;
    G.portal = { x: G.worldLen - 130, y: GROUND - 90, t: 0 };
    G.completeT = 0;
    G.shake = 14;
    spawnParticles(b.x + b.w / 2, b.y + b.h / 2, 60, '#fbbf24', 320);
    for (var i = 0; i < 22; i++) {
      DR.push({
        kind: 'coin', x: b.x + b.w / 2, y: b.y + b.h / 2,
        vx: rand(-280, 280), vy: rand(-500, -170), t: 0, life: 14, value: 3
      });
    }
    dropPotion(b.x + b.w / 2, b.y + b.h / 2, 'hp');
    dropPotion(b.x + b.w / 2, b.y + b.h / 2, 'mp');
    // BOSS 装备掉落（降低高品质刷新率）
    var bq = clamp(G.stageIndex - 1, 0, 3);
    if (G.stageIndex >= 3 && Math.random() < 0.18) bq = Math.min(3, bq + 1);
    dropGearWorld(b.x + b.w / 2 - 20, b.y, 'weapon', clamp(bq, 0, 3));
    if (Math.random() < 0.7) dropGearWorld(b.x + b.w / 2 + 20, b.y, 'armor', clamp(bq - (Math.random() < 0.55 ? 1 : 0), 0, 3));
    // BOSS 经验球
    dropXpOrb(b.x + b.w / 2, b.y - 20, Math.round(b.xp * 0.55));
    dropXpOrb(b.x + b.w / 2 + 30, b.y - 30, Math.round(b.xp * 0.45));
    banner('关卡完成', 'BOSS 掉落了装备！进入传送门前进');
    sfx.win();
  }

  function completeStage() {
    if (G.mode !== 'playing') return;
    G.portal = null;
    G.lastBonus = 60 + G.stageIndex * 30;
    G.coins += G.lastBonus;
    if (G.stageIndex + 1 > best.stage) {
      best.stage = G.stageIndex + 1;
      best.level = Math.max(best.level, G.level);
      saveBest();
    }
    if (G.stageIndex >= STAGES.length - 1) {
      G.mode = 'win';
      showWin();
    } else {
      G.mode = 'clear';
      showClear();
    }
  }

  function showClear() {
    showOverlay(
      '<div class="panel" style="text-align:center">' +
        '<h1 style="font-size:28px;margin:0 0 8px;color:#fbbf24">关卡完成</h1>' +
        '<p style="color:#cbd5e1;margin:0 0 6px">第 ' + (G.stageIndex + 1) + ' 关 · ' + (G.stage ? G.stage.name : '') + '</p>' +
        '<p style="color:#94a3b8;margin:0 0 14px">通关奖励 +' + (G.lastBonus || 0) + ' 金币 · 装备靠拾取，词条随品阶增强</p>' +
        '<div style="text-align:left;font-size:12px;line-height:1.7;margin:0 auto 14px;max-width:520px;background:rgba(15,23,42,.45);padding:10px 12px;border-radius:10px">' +
          '⚔ ' + equipLine(G.equip.weapon) + '<br>🛡 ' + equipLine(G.equip.armor) +
        '</div>' +
        '<p style="color:#64748b;font-size:12px;margin:0 0 14px">下一关开局可在商人处用金币购买装备</p>' +
        '<div class="row"><button class="btn" id="clearNext">进入下一关</button></div>' +
      '</div>'
    );
    var nx = document.getElementById('clearNext');
    if (nx) nx.addEventListener('click', nextStage);
  }
  // ============================================================
  //  怪物
  // ============================================================
  function eachMonster(fn) {
    for (var i = M.length - 1; i >= 0; i--) {
      if (M[i]) fn(M[i], i);
    }
  }

  function updateMonsters(dt) {
    for (var i = M.length - 1; i >= 0; i--) {
      var m = M[i];
      if (!m || m.dead) continue;

      m.t += dt;
      if (m.flash > 0) m.flash -= dt;
      if (m.hurtT > 0) m.hurtT -= dt;
      if (m.slowT > 0) m.slowT -= dt;
      if (m.contactCd > 0) m.contactCd -= dt;
      if (m.cd > 0) m.cd -= dt;
      if (m.jumpCd > 0) m.jumpCd -= dt;
      if (m.stateT > 0) m.stateT -= dt;
      if (m.burnT > 0) {
        m.burnT -= dt; m.burnTick = (m.burnTick || 0) - dt;
        if (m.burnTick <= 0) { m.burnTick = 0.45; hurtMonster(m, m.burnDmg || 3, 0, '#fb923c', { noSplit: true, noExplode: true, noCombo: true, noProc: true, shallow: true }); if (!m || m.dead) continue; spawnParticles(m.x + m.w * 0.5, m.y + m.h * 0.4, 2, '#fb923c', 36); }
      }

      var pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
      var mcx = m.x + m.w / 2, mcy = m.y + m.h / 2;
      var dx = pcx - mcx, dy = pcy - mcy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var spd = m.spd * (m.slowT > 0 ? 0.35 : 1);

      if (m.kind === 'hop') updateSlime(m, dt, dx, d);
      else if (m.kind === 'fly') updateBat(m, dt, dx, dy, d, spd);
      else if (m.kind === 'caster') updateCaster(m, dt, dx, dy, d, spd);
      else updateWalker(m, dt, dx, dy, d, spd);

      // 击退
      if (Math.abs(m.kx) > 1) {
        m.x += m.kx * dt;
        m.kx *= Math.pow(0.008, dt);
        if (Math.abs(m.kx) < 4) m.kx = 0;
      }

      // 重力 + 平台/地面碰撞（怪物可在复杂地形间跳跃落脚）
      if (m.kind !== 'fly') {
        var wasOnGround = m.onGround;
        m.vy += GRAV * dt;
        m.y += m.vy * dt;
        m.onGround = false;
        // 平台（仅下落时单向落脚）
        if (m.vy >= 0) {
          for (var pi = 0; pi < PL.length; pi++) {
            var pl = PL[pi];
            if (m.x + m.w > pl.x + 2 && m.x < pl.x + pl.w - 2) {
              var foot = m.y + m.h;
              var prevFoot = foot - m.vy * dt;
              if (prevFoot <= pl.y + 8 && foot >= pl.y && foot <= pl.y + 22) {
                m.y = pl.y - m.h;
                m.vy = 0;
                m.onGround = true;
                break;
              }
            }
          }
        }
        if (m.y + m.h >= GROUND) {
          if (!wasOnGround && !m.onGround) m.vx *= 0.3;
          m.y = GROUND - m.h;
          m.vy = 0;
          m.onGround = true;
        }
      }

      // 接触伤害
      if (m.contactCd <= 0 && overlap(P, m)) {
        hurtPlayer(m.atk);
        m.contactCd = 1.0;
      }

      m.x = clamp(m.x, 24, G.worldLen - m.w - 24);
      if (m.kind === 'fly') m.y = clamp(m.y, 54, GROUND - m.h - 26);
    }
  }

  function updateSlime(m, dt, dx, d) {
    if (m.onGround) {
      m.vx *= Math.pow(0.02, dt);
      if (m.stateT <= 0 && d < 620) {
        m.face = dx > 0 ? 1 : -1;
        m.vy = -430;
        m.vx = m.face * 150;
        m.stateT = 1.45;
        m.onGround = false;
      }
    }
    m.x += m.vx * dt;
  }

  function updateBat(m, dt, dx, dy, d, spd) {
    m.face = dx > 0 ? 1 : -1;
    m.x += m.face * spd * dt;
    var ty = d < 360
      ? (P.y + P.h / 2) - m.h / 2
      : m.homeY + Math.sin(m.t * 2.6) * 40;
    m.y += clamp(ty - m.y, -150 * dt, 150 * dt);
  }

  function monsterTerrainJump(m, dx, dy, d) {
    if (m.kind === 'fly' || !m.onGround || m.jumpCd > 0) return;
    var playerAbove = (m.y + m.h) - (P.y + P.h) > 36 && Math.abs(dx) < 340 && d < 420;
    var gapJump = Math.abs(dx) > 40 && Math.abs(dx) < 180 && (P.y <= m.y + 8);
    if (playerAbove || (gapJump && Math.random() < 0.02)) {
      m.vy = playerAbove ? -720 : -560;
      m.vx = (dx > 0 ? 1 : -1) * (playerAbove ? 120 : 80);
      m.onGround = false;
      m.jumpCd = playerAbove ? 0.55 : 0.9;
    }
  }

  function updateWalker(m, dt, dx, dy, d, spd) {
    m.face = dx > 0 ? 1 : -1;
    monsterTerrainJump(m, dx, dy, d);
    if (m.type === 'golem') {
      if (m.state === 'slam') {
        if (m.stateT <= 0) {
          m.state = 'idle';
          m.cd = 1.8;
          addZone({ type: 'ring', x: m.x + m.w / 2, y: GROUND - 4, r: 165, t: 0.4, max: 0.4, color: '#a8a29e' });
          if (P.onGround && Math.abs((P.x + P.w / 2) - (m.x + m.w / 2)) < 175) hurtPlayer(m.atk * 1.4);
          G.shake = Math.max(G.shake, 7);
          sfx.hit();
        }
        return;
      }
      if (d < 150 && m.cd <= 0) { m.state = 'slam'; m.stateT = 0.55; return; }
      if (d > 60) m.x += m.face * spd * dt;
      return;
    }

    // 骷髅兵
    if (m.state === 'wind') {
      if (m.stateT <= 0) {
        m.state = 'idle';
        m.cd = 1.45;
        var box = { x: m.face > 0 ? m.x + m.w - 6 : m.x - 44, y: m.y + 6, w: 50, h: m.h - 8 };
        SW.push({ x: m.x + m.w / 2, y: m.y + m.h / 2, face: m.face, t: 0.18, max: 0.18, combo: 1, enemy: true });
        if (overlap(box, P)) hurtPlayer(m.atk * 1.3);
        sfx.swing();
      }
      return;
    }
    if (d < 72 && m.cd <= 0) { m.state = 'wind'; m.stateT = 0.38; return; }
    if (d > 48) m.x += m.face * spd * dt;
  }

  function updateCaster(m, dt, dx, dy, d, spd) {
    m.face = dx > 0 ? 1 : -1;
    monsterTerrainJump(m, dx, dy, d);
    if (d < 230) m.x -= m.face * spd * 0.75 * dt;
    else if (d > 350) m.x += m.face * spd * dt;

    if (m.cd <= 0 && d < 560) {
      m.cd = 1.75;
      var ang = Math.atan2((P.y + P.h / 2) - (m.y + m.h * 0.42), (P.x + P.w / 2) - (m.x + m.w / 2));
      spawnShot({
        x: m.x + m.w / 2, y: m.y + m.h * 0.42,

  function hurtMonster(m, dmg, dir, color, opts) {
    if (!m || m.dead) return 0;
    opts = opts || {};
    var d = Math.max(1, dmg - m.def * 0.5);
    m.hp -= d;

  function updateBoss(dt) {
    var b = G.boss;
    if (!b) return;

    b.t += dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.contactCd > 0) b.contactCd -= dt;
    if (b.slowT > 0) b.slowT -= dt;
    if (b.burnT > 0) {
      b.burnT -= dt; b.burnTick = (b.burnTick || 0) - dt;
      if (b.burnTick <= 0) { b.burnTick = 0.45; hurtBoss(b.burnDmg || 3, 0, '#fb923c', { noSplit: true, noExplode: true, noCombo: true, noProc: true, shallow: true }); spawnParticles(b.x + b.w * 0.5, b.y + b.h * 0.4, 2, '#fb923c', 40); }
    }
    b.face = (P.x + P.w / 2) < (b.x + b.w / 2) ? -1 : 1;

    var ai = BOSS_AI[b.type];
    if (ai) ai(b, dt);

    b.vy += GRAV * dt;
    b.y += b.vy * dt;
    if (b.y + b.h >= GROUND) {
      if (!b.onGround) b.vx *= 0.4;
      b.y = GROUND - b.h;
      b.vy = 0;
      b.onGround = true;
    } else {
      b.onGround = false;
    }
    b.x += b.vx * dt;
    b.x = clamp(b.x, G.barrierX + 40, G.worldLen - b.w - 34);

    if (b.contactCd <= 0 && overlap(P, b)) {
      hurtPlayer(b.atk * 0.9);
      b.contactCd = 1.2;
    }
  }

  function hurtBoss(dmg, dir, color, opts) {

    if (!opts.noLifesteal) applyLifesteal(d);
    if (!opts.noProc) procOnHit(b.x + b.w / 2, b.y + b.h * 0.4, d, opts);

      if (b.teleT > 0) {
        b.teleT -= dt;

          b.x = clamp(P.x + (P.x > b.x ? -200 : 200), G.barrierX + 40, G.worldLen - b.w - 40);
