  // ============================================================
  //  弹道
  // ============================================================
  function spawnShot(o) {
    var burn = o.burn || 0, chain = o.chain || 0, bouncesLeft = o.bouncesLeft || 0, pierce = !!o.pierce;
    // 射手装备词条作用于箭矢
    if (typeof G !== 'undefined' && G.cls === 'archer' && o.friendly && (o.kind === 'arrow' || o.fromAA || o.kind === 'snipe')) {
      if (!burn) burn = equipStat('burn') || 0;
      if (!chain) {
        chain = equipStat('chain') || 0;
        if (!bouncesLeft && chain > 0) bouncesLeft = chain >= 20 ? 3 : (chain >= 10 ? 2 : 1);
      }
      if (!pierce && o.kind !== 'snipe' && (equipStat('pierce') || 0) >= 12) pierce = true;
    }
    PR.push({
      x: o.x, y: o.y, vx: o.vx, vy: o.vy,
      w: o.w || 14, h: o.h || 14, dmg: o.dmg || 5,
      friendly: !!o.friendly, kind: o.kind || 'orb',
      life: o.life || 2.5, t: 0, spin: Math.random() * 6.28,
      pierce: pierce, slow: o.slow || 0, blast: o.blast || 0,
      noSplit: !!o.noSplit, noExplode: !!o.noExplode, shallow: !!o.shallow, noProc: !!o.noProc,
      hitList: o.hitList || null, fromAA: !!o.fromAA,
      burn: burn, chain: chain, bouncesLeft: bouncesLeft
    });
  }

  function nearestTarget(x, y, maxD) {
    var best = null, bestD = maxD || 560;

    function consider(tx, ty) {
      var d = dist(x, y, tx, ty);
      if (d < bestD) { bestD = d; best = { x: tx, y: ty }; }
    }

    for (var i = 0; i < M.length; i++) {
      var m = M[i];
      if (!m || m.dead) continue;
      consider(m.x + m.w / 2, m.y + m.h / 2);
    }
    if (G.boss) consider(G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2);
    return best;
  }

  function updateShots(dt) {
    for (var i = PR.length - 1; i >= 0; i--) {
      var s = PR[i];
      s.t += dt;
      s.life -= dt;
      if (s.kind === 'meteor') s.vy += 420 * dt;

      var homing = s.friendly &&
        (s.kind === 'arrow' || s.kind === 'bolt' || s.kind === 'blast' ||
         (s.kind === 'pierce' && s.t < 0.3));
      if (homing && s.t < 0.55) {
        var tgt = nearestTarget(s.x, s.y, 520);
        if (tgt) {
          var sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy) || 1;
          var cur = Math.atan2(s.vy, s.vx);
          var want = Math.atan2(tgt.y - s.y, tgt.x - s.x);
          var diff = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
          cur += clamp(diff, -9 * dt, 9 * dt);
          s.vx = Math.cos(cur) * sp;
          s.vy = Math.sin(cur) * sp;
        }
      }

      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.spin += dt * 8;

      if (s.life <= 0 || s.y > GROUND + 80 ||
          s.x < G.camX - 260 || s.x > G.camX + W + 260) {
        if (s.friendly && s.blast && s.life <= 0) {
          explodeAt(s.x, Math.min(s.y, GROUND - 16), s.blast, s.dmg, { noExplode: true, shallow: true });
        }
        PR.splice(i, 1);
        continue;
      }

      var box = { x: s.x - s.w / 2, y: s.y - s.h / 2, w: s.w, h: s.h };

      if (s.friendly) {
        var hit = false;
        var popts = { noSplit: !!s.noSplit, noExplode: !!s.noExplode, shallow: !!s.shallow };
        if (s.noProc) { popts.noProc = true; popts.noLifesteal = true; }
        function applyArrowFx(m, isBoss) {
          if (s.slow) { if (isBoss) G.boss.slowT = Math.max(G.boss.slowT || 0, s.slow); else m.slowT = Math.max(m.slowT, s.slow); }
          if (s.burn) { var bt = 2.6, bd = s.burn * 0.85 + 2; if (isBoss) { G.boss.burnT = Math.max(G.boss.burnT || 0, bt); G.boss.burnDmg = Math.max(G.boss.burnDmg || 0, bd); } else { m.burnT = Math.max(m.burnT || 0, bt); m.burnDmg = Math.max(m.burnDmg || 0, bd); } }
        }
        function chainBounce(fromRef) {
          if (!(s.bouncesLeft > 0)) return false;
          s.bouncesLeft--;
          if (!s.hitList) s.hitList = [];
          if (fromRef && s.hitList.indexOf(fromRef) < 0) s.hitList.push(fromRef);
          var best = null, bestD = 420;
          for (var ci = 0; ci < M.length; ci++) {
            var cm = M[ci];
            if (!cm || cm.dead || cm === fromRef || s.hitList.indexOf(cm) >= 0) continue;
            var cd = dist(s.x, s.y, cm.x + cm.w / 2, cm.y + cm.h / 2);
            if (cd < bestD) { bestD = cd; best = cm; }
          }
          if (!best && G.boss && G.boss !== fromRef && s.hitList.indexOf(G.boss) < 0) {
            var cbd = dist(s.x, s.y, G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2);
            if (cbd < 460) best = G.boss;
          }
          if (best) {
            var sp = Math.sqrt(s.vx * s.vx + s.vy * s.vy) || 620;
            var ca = Math.atan2((best.y + best.h / 2) - s.y, (best.x + best.w / 2) - s.x);
            s.vx = Math.cos(ca) * sp; s.vy = Math.sin(ca) * sp;
            s.life = Math.max(s.life, 0.45);
            spawnParticles(s.x, s.y, 4, '#67e8f9', 120);
            return true;
          }
          return false;
        }
        var hitRef = null;
        for (var j = M.length - 1; j >= 0; j--) {
          var m = M[j];
          if (!m || m.dead) continue;
          if (s.hitList && s.hitList.indexOf(m) >= 0) continue;
          if (overlap(box, m)) {
            hurtMonster(m, s.dmg, s.vx >= 0 ? 1 : -1, s.kind === 'frost' ? '#a5f3fc' : (s.kind === 'split' ? '#86efac' : (s.pierce || s.chain ? '#bbf7d0' : '#ffffff')), popts);
            applyArrowFx(m, false);
            hitRef = m;
            var bounced = (s.bouncesLeft > 0) ? chainBounce(m) : false;
            if (bounced || s.pierce) {
              if (!s.hitList) s.hitList = [];
              if (s.hitList.indexOf(m) < 0) s.hitList.push(m);
              if (bounced) break;
            } else {
              hit = true;
              break;
            }
          }
        }
        if (!hit && G.boss && overlap(box, G.boss) &&
            !(s.hitList && s.hitList.indexOf(G.boss) >= 0)) {
          hurtBoss(s.dmg, s.vx >= 0 ? 1 : -1, s.kind === 'split' ? '#86efac' : (s.pierce || s.chain ? '#bbf7d0' : '#ffffff'), popts);
          applyArrowFx(G.boss, true);
          hitRef = G.boss;
          var bouncedB = (s.bouncesLeft > 0) ? chainBounce(G.boss) : false;
          if (bouncedB || s.pierce) {
            if (!s.hitList) s.hitList = [];
            if (s.hitList.indexOf(G.boss) < 0) s.hitList.push(G.boss);
          } else {
            hit = true;
          }
        }
        if (s.pierce || (s.chain && s.hitList && s.hitList.length)) {
          if (s.hitList && s.hitList.length && Math.random() < 0.4) {
            spawnParticles(s.x, s.y, 1, s.chain ? '#67e8f9' : '#bbf7d0', 90);
          }
        } else if (hit) {
          if (s.blast) explodeAt(s.x, s.y, s.blast, s.dmg, { noExplode: true, shallow: true });
          spawnParticles(s.x, s.y, 5, s.kind === 'split' ? '#86efac' : '#ffffff', 150);
          PR.splice(i, 1);
        }
      } else {
        var pb = { x: P.x + 4, y: P.y + 8, w: P.w - 8, h: P.h - 12 };
        if (overlap(box, pb)) {
          hurtPlayer(s.dmg);
          spawnParticles(s.x, s.y, 7, s.kind === 'fire' ? '#fb923c' : '#a5b4fc', 170);
          PR.splice(i, 1);
        }
      }
    }
  }

  // ============================================================
  //  区域 / 粒子 / 掉落
  // ============================================================
  function addZone(z) {
    z.t = z.t || 0.4;
    z.max = z.t;
    ZN.push(z);
  }

  function updateZones(dt) {
    for (var i = ZN.length - 1; i >= 0; i--) {
      var z = ZN[i];
      z.t -= dt;

      if (z.type === 'rain') {
        if (z.lock) {
          var rainGone = z.lockBoss ? (G.boss !== z.lock || z.lock.hp <= 0) : (z.lock.dead || z.lock.hp <= 0);
          if (rainGone) z.lock = null;
        }
        if (!z.lock) {
          var rainNext = pickLockTarget(z.x, GROUND - 120, 470, false);
          if (rainNext) { z.lock = rainNext.ref; z.lockBoss = rainNext.boss; }
        }
        if (z.lock) {
          z.x = clamp(lerp(z.x, z.lock.x + z.lock.w / 2, 1 - Math.pow(0.004, dt)), 120, G.worldLen - 120);
        }

        z.tick -= dt;
        if (z.tick <= 0) {
          z.tick = 0.14;
                  var mul = z.mul || 1;
          var zopts = { noSplit: true, noExplode: true, noCombo: true };
          eachMonster(function (m) {
            if (Math.abs((m.x + m.w / 2) - z.x) < z.w / 2) {
              hurtMonster(m, atkVal() * 0.5 * mul, 0, '#4ade80', zopts);
            }
          });
          if (G.boss && Math.abs((G.boss.x + G.boss.w / 2) - z.x) < z.w / 2 + 30) {
            hurtBoss(atkVal() * 0.5 * mul, 0, '#4ade80', zopts);
          }
          for (var k = 0; k < 2; k++) {
            PT.push({
              x: z.x + rand(-z.w / 2, z.w / 2), y: GROUND - 330,
              vx: 0, vy: 900, life: 0.42, max: 0.42, size: 3, color: '#4ade80', grav: 0
            });
          }
        }
      }

      if (z.type === 'meteor') {
        if (z.lock) {
          var mGone = z.lockBoss ? (G.boss !== z.lock || z.lock.hp <= 0) : (z.lock.dead || z.lock.hp <= 0);
          if (mGone) z.lock = null;
          else z.x = z.lock.x + z.lock.w / 2;
        }
        if (z.t <= 0 && !z.done) {
          z.done = true;
          var mx = z.x;
          eachMonster(function (m) {
            if (dist(mx, GROUND, m.x + m.w / 2, m.y + m.h / 2) < 155 + Math.max(m.w, m.h) * 0.3) {
              hurtMonster(m, z.dmg, (m.x + m.w / 2) >= mx ? 1 : -1, '#fb923c');
            }
          });
          if (G.boss && dist(mx, GROUND, G.boss.x + G.boss.w / 2, G.boss.y + G.boss.h / 2) < 175 + G.boss.w * 0.3) {
            hurtBoss(z.dmg, (G.boss.x + G.boss.w / 2) >= mx ? 1 : -1, '#fb923c');
          }
          addZone({ type: 'burst', x: mx, y: GROUND - 46, r: 180, t: 0.5, max: 0.5, color: '#fb923c' });
          spawnParticles(mx, GROUND - 30, 34, '#fb923c', 320);
          G.shake = Math.max(G.shake, 13);
          sfx.hit();
        }
      }

      if (z.type === 'firestorm') {
        if (z.lock) {
          var fGone = z.lockBoss ? (G.boss !== z.lock || z.lock.hp <= 0) : (z.lock.dead || z.lock.hp <= 0);
          if (fGone) z.lock = null;
        }
        if (!z.lock) {
          var fNext = pickLockTarget(z.x, GROUND - 80, 380, false);
          if (fNext) { z.lock = fNext.ref; z.lockBoss = fNext.boss; }
        }
        if (z.lock) z.x = clamp(lerp(z.x, z.lock.x + z.lock.w / 2, 1 - Math.pow(0.01, dt)), 120, G.worldLen - 120);
        z.tick -= dt;
        if (z.tick <= 0) {
          z.tick = 0.22;
          var fmul = z.mul || 1;
          var fopts = { noSplit: true, noExplode: true, noCombo: true };
          eachMonster(function (m) {
            if (Math.abs((m.x + m.w / 2) - z.x) < z.w / 2 && m.y + m.h > GROUND - 140) {
              hurtMonster(m, atkVal() * 1.65 * fmul + 5, 0, '#fb923c', fopts);
            }
          });
          if (G.boss && Math.abs((G.boss.x + G.boss.w / 2) - z.x) < z.w / 2 + 40) {
            hurtBoss(atkVal() * 1.65 * fmul + 5, 0, '#fb923c', fopts);
          }
          if (Math.random() < 0.7) spawnParticles(z.x + rand(-z.w * 0.4, z.w * 0.4), GROUND - rand(10, 90), 2, '#fb923c', 120);
        }
      }

      if (z.type === 'pillar' && z.t <= 0 && !z.done) {
        z.done = true;
        if (Math.abs((P.x + P.w / 2) - z.x) < 74) hurtPlayer(z.dmg);
        addZone({ type: 'burst', x: z.x, y: GROUND - 76, r: 86, t: 0.4, max: 0.4, color: '#fb923c' });
        spawnParticles(z.x, GROUND - 40, 26, '#fb923c', 280);
        G.shake = Math.max(G.shake, 9);
        sfx.hit();
      }

      if (z.t <= 0) ZN.splice(i, 1);
    }
  }

  function spawnParticles(x, y, n, color, spread) {
    spread = spread || 180;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283;
      var sp = rand(spread * 0.28, spread);
      PT.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
        life: rand(0.25, 0.62), max: 0.62, size: rand(1.6, 3.6),
        color: color, grav: 620
      });
    }
    if (PT.length > 460) PT.splice(0, PT.length - 460);
  }

  function addNum(x, y, text, color, size) {
    TX.push({ x: x, y: y, text: text, color: color, size: size || 14, life: 0.9, max: 0.9 });
    if (TX.length > 80) TX.shift();
  }

  function updateSwings(dt) {
    for (var i = SW.length - 1; i >= 0; i--) {
      SW[i].t -= dt;
      if (SW[i].t <= 0) SW.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (var i = PT.length - 1; i >= 0; i--) {
      var p = PT[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.grav * dt;
      p.vx *= Math.pow(0.2, dt);
      p.life -= dt;
      if (p.life <= 0) PT.splice(i, 1);
    }
    for (var j = TX.length - 1; j >= 0; j--) {
      var t = TX[j];
      t.y -= 36 * dt;
      t.life -= dt;
      if (t.life <= 0) TX.splice(j, 1);
    }
    if (G.toast) {
      G.toast.t -= dt;
      if (G.toast.t <= 0) G.toast = null;
    }
  }

  function dropPotion(x, y, kind) {
    DR.push({ kind: kind, x: x, y: y, vx: rand(-70, 70), vy: -280, t: 0, life: 18, value: 0 });
  }

  function dropXpOrb(x, y, amount) {
    var v = Math.max(1, Math.round(amount || 1));
    var n = v > 14 ? 2 : 1;
    for (var i = 0; i < n; i++) {
      var a = i === 0 ? Math.round(v * (n === 2 ? 0.55 : 1)) : (v - Math.round(v * 0.55));
      DR.push({ kind: 'xp', x: x + rand(-10, 10), y: y, vx: rand(-90, 90), vy: rand(-320, -180), t: 0, life: 22, value: a });
    }
  }

  function dropGearWorld(x, y, slot, quality, cls) {
    var item = makeGearDrop(slot, quality, cls);
    DR.push({ kind: 'gear', x: x, y: y, vx: rand(-110, 110), vy: rand(-360, -180), t: 0, life: 30, item: item });
  }

  function rollMobGearDrop(m) {
    var si = G.stageIndex;
    var tough = (m.type === 'golem' || m.type === 'skeleton' || m.type === 'mage');
    var chance = tough ? 0.18 : 0.09;
    chance += si * 0.012;
    if (Math.random() > chance) return;
    var slot = Math.random() < 0.5 ? 'weapon' : 'armor';
    var r = Math.random();
    var q = 0; // 降低高品质刷新率
    if (si >= 4) q = r < 0.06 ? 3 : (r < 0.22 ? 2 : (r < 0.62 ? 1 : 0));
    else if (si >= 2) q = r < 0.02 ? 3 : (r < 0.12 ? 2 : (r < 0.48 ? 1 : 0));
    else if (si >= 1) q = r < 0.06 ? 2 : (r < 0.34 ? 1 : 0);
    else q = r < 0.12 ? 1 : 0;
    if (!tough && q > 0 && Math.random() < 0.55) q--;
    dropGearWorld(m.x + m.w / 2, m.y, slot, clamp(q, 0, 3));
  }

  function updateDrops(dt) {
    for (var i = DR.length - 1; i >= 0; i--) {
      var d = DR[i];
      d.t += dt;

      // 掉落金币自动拾取
      if (d.kind === 'coin' && d.t > 0.1) {
        d._auto = true;
        collectDrop(d);
        DR.splice(i, 1);
        continue;
      }

      if (d.t > 0.35) {
        var dd = dist(d.x, d.y, P.x + P.w / 2, P.y + P.h / 2);
        if (dd < 96) {
          var a = Math.atan2(P.y + P.h / 2 - d.y, P.x + P.w / 2 - d.x);
          var pull = (1 - dd / 96) * 440 * dt;
          d.x += Math.cos(a) * pull;
          d.y += Math.sin(a) * pull;
        }
        if (dd < 36) {
          collectDrop(d);
          DR.splice(i, 1);
          continue;
        }
      }

      d.vy += GRAV * 0.85 * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (d.y > GROUND - 12) {
        d.y = GROUND - 12;
        d.vy *= -0.42;
        d.vx *= 0.72;
        if (Math.abs(d.vy) < 45) d.vy = 0;
      }
      if (d.life > 0) {
        d.life -= dt;
        if (d.life <= 0) DR.splice(i, 1);
      }
    }
  }

  function recycleValue(it) {
    if (!it) return 0;
    return 10 + clamp(it.quality || 0, 0, 3) * 14;
  }
  function isLowTierGear(it) { return !!it && (it.quality || 0) <= 0; } // 灰色低阶直接回收
  function ensureBag() { if (!G.bag) G.bag = []; }
  function bagAdd(it) {
    ensureBag();
    if (isLowTierGear(it)) {
      var sv = recycleValue(it);
      G.coins += sv;
      addNum(it._px || (P ? P.x : 0), (it._py || (P ? P.y : 0)) - 10, '回收 +' + sv, '#94a3b8', 12);
      toast('低阶装备已回收 +' + sv, '#94a3b8');
      return 'recycled';
    }
    it._uid = it._uid || ('g' + Date.now() + '_' + Math.floor(Math.random() * 9999));
    G.bag.push(it);
    toast('入包：[' + qName(it.quality) + '] ' + it.name + ' (B打开背包)', qColor(it.quality));
    return 'bag';
  }
  function equipFromBag(idx) {
    ensureBag();
    if (idx < 0 || idx >= G.bag.length) return;
    var it = G.bag[idx];
    if (!it) return;
    var slot = it.slot;
    var cur = G.equip[slot];
    var oldHp = maxHp(), oldMp = maxMp();
    G.equip[slot] = it;
    G.bag.splice(idx, 1);
    if (cur) G.bag.push(cur);
    G.hp = Math.min(maxHp(), Math.max(1, G.hp + (maxHp() - oldHp)));
    G.mp = Math.min(maxMp(), Math.max(0, G.mp + (maxMp() - oldMp)));
    toast('已装备：[' + qName(it.quality) + '] ' + it.name, qColor(it.quality));
    sfx.buy();
    if (G.mode === 'bag') renderBag();
  }
  function recycleBagItem(idx) {
    ensureBag();
    if (idx < 0 || idx >= G.bag.length) return;
    var it = G.bag.splice(idx, 1)[0];
    var sv = recycleValue(it);
    G.coins += sv;
    toast('回收：' + (it ? it.name : '') + ' +' + sv, '#94a3b8');
    sfx.coin();
    if (G.mode === 'bag') renderBag();
  }
  function gearAffixText(it) {
    if (!it) return '无';
    if (!it.affixes || !it.affixes.length) return '无词条';
    return it.affixes.map(function(a){ return a.name + '+' + a.value; }).join('  ');
  }
  function recycleEquipped(slot) {
    var it = G.equip && G.equip[slot];
    if (!it) return;
    // 保底：不给直接回收穿戴中的唯一装备？允许回收但会无装备 - 不太好。改为不允许回收已装备，必须先换。
    toast('请先从背包装备替换', '#fbbf24');
  }

  function collectDrop(d) {
    if (d.kind === 'coin') {
      G.coins += d.value || 1;
      if (!d._auto) {
        addNum(d.x, d.y - 10, '+' + (d.value || 1), '#fbbf24', 12);
        sfx.coin();
      }
    } else if (d.kind === 'xp') {
      var xv = d.value || 1;
      addNum(d.x, d.y - 12, 'XP +' + xv, '#a78bfa', 13);
      gainXp(xv);
      sfx.coin();
    } else if (d.kind === 'hp') {
      var h = Math.round(maxHp() * 0.35);
      G.hp = Math.min(maxHp(), G.hp + h);
      addNum(d.x, d.y - 10, '+' + h, '#f87171', 13);
      sfx.coin();
    } else if (d.kind === 'mp') {
      var mm = Math.round(maxMp() * 0.4);
      G.mp = Math.min(maxMp(), G.mp + mm);
      addNum(d.x, d.y - 10, '+' + mm, '#60a5fa', 13);
      sfx.coin();
    } else if (d.kind === 'gear' && d.item) {
      var it = d.item;
      it._px = d.x; it._py = d.y;
      if (isLowTierGear(it)) {
        var sv = recycleValue(it);
        G.coins += sv;
        addNum(d.x, d.y - 10, '低阶回收 +' + sv, '#94a3b8', 12);
        toast('低阶装备自动回收 +' + sv, '#94a3b8');
        sfx.coin();
      } else {
        ensureBag();
        it._uid = it._uid || ('g' + Date.now() + '_' + Math.floor(Math.random() * 9999));
        G.bag.push(it);
        addNum(d.x, d.y - 14, it.name, qColor(it.quality), 13);
        toast('入背包：[' + qName(it.quality) + '] ' + it.name, qColor(it.quality));
        sfx.buy();
      }
    }
  }

  function updateCoins(dt) {
    for (var i = 0; i < COINS.length; i++) {
      var c = COINS[i];
      if (c.taken) continue;
      c.bob += dt * 3.2;
      if (dist(c.x, c.y, P.x + P.w / 2, P.y + P.h / 2) < 36) {
        c.taken = true;
        G.coins += 1;
        addNum(c.x, c.y - 8, '+1', '#fbbf24', 11);
        spawnParticles(c.x, c.y, 3, '#fbbf24', 90);
        sfx.coin();
      }
    }
  }

  function updateChests(dt) {
    for (var i = 0; i < CHESTS.length; i++) {
      var c = CHESTS[i];
      if (c.opened) continue;
      c.bob += dt * 2;
      if (overlap(P, { x: c.x, y: c.y, w: c.w, h: c.h })) {
        c.opened = true;
        // 宝箱少量金币（主要靠打怪）
        for (var k = 0; k < 5; k++) {
          DR.push({
            kind: 'coin', x: c.x + c.w / 2, y: c.y,
            vx: rand(-220, 220), vy: rand(-520, -230), t: 0, life: 14, value: 1
          });
        }
        dropPotion(c.x + c.w / 2, c.y, Math.random() < 0.5 ? 'hp' : 'mp');
        dropXpOrb(c.x + c.w / 2, c.y - 10, 18 + G.stageIndex * 8);
        if (Math.random() < 0.55) {
          var slot = Math.random() < 0.5 ? 'weapon' : 'armor';
          var cq = 0;
          var cr = Math.random();
          if (G.stageIndex >= 3) cq = cr < 0.08 ? 3 : (cr < 0.32 ? 2 : 1);
          else if (G.stageIndex >= 1) cq = cr < 0.12 ? 2 : (cr < 0.55 ? 1 : 0);
          else cq = cr < 0.22 ? 1 : 0;
          dropGearWorld(c.x + c.w / 2, c.y, slot, clamp(cq, 0, 3));
        }
        toast('打开宝箱！获得补给', '#fbbf24');
        spawnParticles(c.x + c.w / 2, c.y, 18, '#fbbf24', 240);
        sfx.buy();
        G.shake = Math.max(G.shake, 4);
      }
    }
  }
  // ============================================================
  //  场景装饰
  // ============================================================
  var DECOR = { far: [], mid: [], near: [] };
  var DECOR_P = 1200;
  var STARS = [];
  for (var si = 0; si < 76; si++) {
    STARS.push({ x: Math.random() * W, y: Math.random() * H * 0.62, r: rand(0.5, 1.7), p: Math.random() * 6.28 });
  }

  function buildDecor() {
    DECOR = { far: [], mid: [], near: [] };
    var th = G.stage.theme, i, P0 = DECOR_P;

    if (th === 'forest') {
      for (i = 0; i < P0; i += randi(190, 300)) DECOR.far.push({ x: i, s: rand(1.0, 1.8), k: 'hill' });
      for (i = 0; i < P0; i += randi(150, 240)) DECOR.mid.push({ x: i, s: rand(0.85, 1.35), k: 'tree' });
      for (i = 0; i < P0; i += randi(85, 160)) DECOR.near.push({ x: i, s: rand(0.5, 0.95), k: Math.random() < 0.55 ? 'bush' : 'grass' });
    } else if (th === 'cave') {
      for (i = 0; i < P0; i += randi(220, 340)) DECOR.far.push({ x: i, s: rand(1.0, 1.7), k: 'mound' });
      for (i = 0; i < P0; i += randi(130, 220)) DECOR.mid.push({ x: i, s: rand(0.7, 1.3), k: Math.random() < 0.5 ? 'stalag' : 'crystal' });
      for (i = 0; i < P0; i += randi(80, 150)) DECOR.near.push({ x: i, s: rand(0.4, 0.85), k: 'pebble' });
    } else if (th === 'castle') {
      for (i = 0; i < P0; i += randi(260, 400)) DECOR.far.push({ x: i, s: rand(1.0, 1.8), k: 'tower' });
      for (i = 0; i < P0; i += randi(180, 280)) DECOR.mid.push({ x: i, s: rand(0.8, 1.25), k: 'window' });
      for (i = 0; i < P0; i += randi(110, 200)) DECOR.near.push({ x: i, s: rand(0.5, 0.9), k: 'torch' });
    } else if (th === 'lava') {
      for (i = 0; i < P0; i += randi(280, 420)) DECOR.far.push({ x: i, s: rand(1.1, 1.9), k: 'volcano' });
      for (i = 0; i < P0; i += randi(150, 250)) DECOR.mid.push({ x: i, s: rand(0.7, 1.25), k: 'rock' });
      for (i = 0; i < P0; i += randi(90, 170)) DECOR.near.push({ x: i, s: rand(0.4, 0.9), k: 'ember' });
    } else {
      for (i = 0; i < P0; i += randi(200, 320)) DECOR.far.push({ x: i, s: rand(0.9, 1.5), k: 'cloud' });
      for (i = 0; i < P0; i += randi(260, 400)) DECOR.mid.push({ x: i, s: rand(0.8, 1.4), k: 'island' });
      for (i = 0; i < P0; i += randi(130, 220)) DECOR.near.push({ x: i, s: rand(0.5, 0.9), k: 'pillar' });
    }
  }

  function drawLayer(list, factor, drawOne) {
    var off = (G.camX * factor) % DECOR_P;
    for (var r = -1; r <= 2; r++) {
      var base = r * DECOR_P - off;
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        var sx = base + it.x;
        if (sx < -320 || sx > W + 320) continue;
        drawOne(it, sx);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ============================================================
  //  背景
  // ============================================================
  function drawBackground() {
    var th = THEMES[G.stage.theme];
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (G.stage.theme === 'forest') {
      ctx.fillStyle = 'rgba(255,250,214,0.9)';
      ctx.beginPath(); ctx.arc(W * 0.78, 86, 42, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,250,214,0.16)';
      ctx.beginPath(); ctx.arc(W * 0.78, 86, 76, 0, 6.283); ctx.fill();
    } else if (G.stage.theme === 'castle' || G.stage.theme === 'cave') {
      ctx.fillStyle = 'rgba(238,240,255,0.9)';
      ctx.beginPath(); ctx.arc(W * 0.8, 84, 32, 0, 6.283); ctx.fill();
      ctx.fillStyle = th.sky[0];
      ctx.beginPath(); ctx.arc(W * 0.8 - 14, 74, 28, 0, 6.283); ctx.fill();
    } else if (G.stage.theme === 'lava') {
      var rg = ctx.createRadialGradient(W * 0.5, H + 40, 30, W * 0.5, H + 40, 560);
      rg.addColorStop(0, 'rgba(251,146,60,0.26)');
      rg.addColorStop(1, 'rgba(251,146,60,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
    } else {
      var sg = ctx.createRadialGradient(W * 0.5, 40, 20, W * 0.5, 40, 420);
      sg.addColorStop(0, 'rgba(255,246,214,0.28)');
      sg.addColorStop(1, 'rgba(255,246,214,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H);
    }

    if (th.star) {
      for (var i = 0; i < STARS.length; i++) {
        var st = STARS[i];
        var a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(G.time * 1.6 + st.p));
        ctx.fillStyle = 'rgba(226,232,255,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, 6.283);
        ctx.fill();
      }
    }

    drawLayer(DECOR.far, 0.18, function (it, sx) { drawFar(it, sx, th); });
    drawLayer(DECOR.mid, 0.42, function (it, sx) { drawMid(it, sx, th); });

    var fg = ctx.createLinearGradient(0, GROUND - 180, 0, GROUND);
    fg.addColorStop(0, 'rgba(255,255,255,0)');
    fg.addColorStop(1, th.fog);
    ctx.fillStyle = fg;
    ctx.fillRect(0, GROUND - 180, W, 180);

    drawLayer(DECOR.near, 0.78, function (it, sx) { drawNear(it, sx, th); });
  }

  function drawFar(it, sx, th) {
    var s = it.s;
    if (it.k === 'hill') {
      ctx.fillStyle = th.far;
      ctx.beginPath();
      ctx.ellipse(sx, GROUND + 40, 210 * s, 130 * s, 0, Math.PI, 0);
      ctx.fill();
    } else if (it.k === 'mound') {
      ctx.fillStyle = th.far;
      ctx.beginPath();
      ctx.moveTo(sx - 170 * s, GROUND + 20);
      ctx.quadraticCurveTo(sx, GROUND - 300 * s, sx + 170 * s, GROUND + 20);
      ctx.fill();
    } else if (it.k === 'tower') {
      ctx.fillStyle = th.far;
      ctx.fillRect(sx - 34 * s, GROUND - 240 * s, 68 * s, 260 * s);
      ctx.beginPath();
      ctx.moveTo(sx - 46 * s, GROUND - 236 * s);
      ctx.lineTo(sx, GROUND - 320 * s);
      ctx.lineTo(sx + 46 * s, GROUND - 236 * s);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,214,120,0.35)';
      for (var wy = 0; wy < 3; wy++) ctx.fillRect(sx - 8 * s, GROUND - 200 * s + wy * 56 * s, 16 * s, 22 * s);
    } else if (it.k === 'volcano') {
      ctx.fillStyle = th.far;
      ctx.beginPath();
      ctx.moveTo(sx - 180 * s, GROUND + 10);
      ctx.lineTo(sx - 40 * s, GROUND - 300 * s);
      ctx.lineTo(sx + 20 * s, GROUND - 260 * s);
      ctx.lineTo(sx + 180 * s, GROUND + 10);
      ctx.fill();
      ctx.fillStyle = 'rgba(251,146,60,0.55)';

      ctx.ellipse(sx - 16 * s, GROUND - 292 * s, 28 * s, 10 * s, 0, 0, 6.283);

    } else if (it.k === 'cloud') {
      ctx.fillStyle = 'rgba(255,255,255,0.18)';

      ctx.arc(sx + 52 * s, GROUND - 320 * s, 42 * s, 0, 6.283);
      ctx.arc(sx - 50 * s, GROUND - 314 * s, 38 * s, 0, 6.283);

    }
  }

  function drawMid(it, sx, th) {

      ctx.fillStyle = '#4a3626';
      ctx.fillRect(sx - 7 * s, GROUND - 120 * s, 14 * s, 130 * s);
      ctx.fillStyle = th.mid;
      ctx.beginPath();
      ctx.arc(sx, GROUND - 150 * s, 48 * s, 0, 6.283);
      ctx.arc(sx - 40 * s, GROUND - 122 * s, 36 * s, 0, 6.283);
      ctx.arc(sx + 40 * s, GROUND - 126 * s, 38 * s, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.beginPath();
      ctx.arc(sx - 12 * s, GROUND - 164 * s, 24 * s, 0, 6.283);
      ctx.fill();
    } else if (it.k === 'stalag') {
      ctx.fillStyle = th.mid;
      ctx.beginPath();
      ctx.moveTo(sx - 26 * s, GROUND);
      ctx.lineTo(sx, GROUND - 130 * s);
      ctx.lineTo(sx + 26 * s, GROUND);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath();
      ctx.moveTo(sx - 8 * s, GROUND);
      ctx.lineTo(sx, GROUND - 130 * s);
      ctx.lineTo(sx + 4 * s, GROUND);
      ctx.fill();
    } else if (it.k === 'crystal') {
      var gl = 0.5 + 0.3 * Math.sin(G.time * 2 + it.x);
      ctx.save();
      ctx.shadowColor = th.accent;
      ctx.shadowBlur = 18;
      ctx.fillStyle = th.accent;
      ctx.globalAlpha = gl;
      ctx.beginPath();
      ctx.moveTo(sx, GROUND - 110 * s);
      ctx.lineTo(sx + 16 * s, GROUND - 56 * s);
      ctx.lineTo(sx, GROUND - 20 * s);
      ctx.lineTo(sx - 16 * s, GROUND - 56 * s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (it.k === 'window') {
      ctx.fillStyle = th.mid;
      ctx.fillRect(sx - 26 * s, GROUND - 210 * s, 52 * s, 220 * s);
      ctx.fillStyle = 'rgba(192,132,252,0.28)';
      ctx.beginPath();
      ctx.moveTo(sx - 16 * s, GROUND - 40 * s);
      ctx.lineTo(sx - 16 * s, GROUND - 170 * s);
      ctx.quadraticCurveTo(sx, GROUND - 208 * s, sx + 16 * s, GROUND - 170 * s);
      ctx.lineTo(sx + 16 * s, GROUND - 40 * s);
      ctx.closePath();
      ctx.fill();
    } else if (it.k === 'rock') {
      ctx.fillStyle = th.mid;
      ctx.beginPath();
      ctx.moveTo(sx - 60 * s, GROUND);
      ctx.lineTo(sx - 34 * s, GROUND - 60 * s);
      ctx.lineTo(sx + 6 * s, GROUND - 82 * s);
      ctx.lineTo(sx + 48 * s, GROUND - 40 * s);
      ctx.lineTo(sx + 60 * s, GROUND);
      ctx.fill();
      ctx.fillStyle = 'rgba(251,146,60,0.25)';
      ctx.fillRect(sx - 20 * s, GROUND - 46 * s, 40 * s, 4 * s);
    } else if (it.k === 'island') {
      ctx.fillStyle = th.mid;
      ctx.beginPath();
      ctx.ellipse(sx, GROUND - 190 * s, 96 * s, 26 * s, 0, 0, 6.283);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(sx - 90 * s, GROUND - 186 * s);
      ctx.lineTo(sx, GROUND - 96 * s);
      ctx.lineTo(sx + 90 * s, GROUND - 186 * s);
      ctx.fill();
      ctx.fillStyle = 'rgba(159,182,226,0.65)';
      ctx.beginPath();
      ctx.ellipse(sx, GROUND - 198 * s, 88 * s, 16 * s, 0, 0, 6.283);
      ctx.fill();

  function drawNear(it, sx, th) {
    var s = it.s;
    if (it.k === 'bush') {
      ctx.fillStyle = '#2f6b45';
      ctx.beginPath();
      ctx.arc(sx, GROUND - 14 * s, 20 * s, 0, 6.283);
      ctx.arc(sx + 20 * s, GROUND - 10 * s, 15 * s, 0, 6.283);
      ctx.arc(sx - 19 * s, GROUND - 9 * s, 13 * s, 0, 6.283);
      ctx.fill();
    } else if (it.k === 'grass') {
      ctx.strokeStyle = 'rgba(110,200,120,0.7)';
      ctx.lineWidth = 2;
      for (var i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * 7, GROUND);
        ctx.quadraticCurveTo(sx + i * 10, GROUND - 16 * s, sx + i * 14, GROUND - 24 * s);
        ctx.stroke();
      }
    } else if (it.k === 'pebble') {
      ctx.fillStyle = 'rgba(120,120,150,0.55)';
      ctx.beginPath();
      ctx.ellipse(sx, GROUND - 4, 16 * s, 6 * s, 0, 0, 6.283);
      ctx.fill();
    } else if (it.k === 'torch') {
      ctx.fillStyle = '#3a2f24';
      ctx.fillRect(sx - 3, GROUND - 78, 6, 78);
      var f = 0.7 + 0.3 * Math.sin(G.time * 9 + it.x);
      ctx.save();
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(192,132,252,' + (0.55 * f) + ')';
      ctx.beginPath();
      ctx.arc(sx, GROUND - 84, 10 * f, 0, 6.283);
      ctx.fill();
      ctx.restore();
    } else if (it.k === 'ember') {
      var yy = GROUND - 40 - ((G.time * 26 + it.x) % 110);
      ctx.fillStyle = 'rgba(251,146,60,0.55)';
      ctx.beginPath();
      ctx.arc(sx + Math.sin(G.time + it.x) * 8, yy, 2.2 * s + 1, 0, 6.283);
      ctx.fill();
    } else if (it.k === 'pillar') {
      ctx.fillStyle = 'rgba(120,140,190,0.45)';
      ctx.fillRect(sx - 12, GROUND - 90 * s, 24, 90 * s);
      ctx.fillStyle = 'rgba(160,180,225,0.35)';
      ctx.fillRect(sx - 18, GROUND - 96 * s, 36, 8);
    }
  }

  // ============================================================
  //  地形
  // ============================================================
  function drawGround() {
    var th = THEMES[G.stage.theme];
    var x0 = G.camX - 60, x1 = G.camX + W + 60;

    ctx.fillStyle = th.ground;
    ctx.fillRect(x0, GROUND, x1 - x0, H - GROUND);

    ctx.fillStyle = th.groundTop;
    ctx.fillRect(x0, GROUND, x1 - x0, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(x0, GROUND, x1 - x0, 3);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(x0, GROUND + 12, x1 - x0, 4);

    var start = Math.floor(x0 / 58) * 58;
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 2;
    for (var x = start; x < x1; x += 58) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND + 20);
      ctx.lineTo(x + 12, H);
      ctx.stroke();
    }

    if (G.stage.theme === 'forest') {
      ctx.strokeStyle = 'rgba(255,255,255,0.32)';
      ctx.lineWidth = 1.5;
      for (var gx = start; gx < x1; gx += 22) {
        ctx.beginPath();
        ctx.moveTo(gx, GROUND + 1);
        ctx.lineTo(gx + 3, GROUND - 6);
        ctx.stroke();
      }
    } else if (G.stage.theme === 'lava') {
      ctx.fillStyle = 'rgba(251,146,60,0.28)';
      for (var lx = start; lx < x1; lx += 110) {
        ctx.fillRect(lx, GROUND + 22, 34, 3);
      }
    }

    var dg = ctx.createLinearGradient(0, GROUND, 0, H);
    dg.addColorStop(0, 'rgba(0,0,0,0)');
    dg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = dg;
    ctx.fillRect(x0, GROUND, x1 - x0, H - GROUND);
  }

  function drawPlatforms() {
    var th = THEMES[G.stage.theme];
    for (var i = 0; i < PL.length; i++) {
      var p = PL[i];
      if (p.x + p.w < G.camX - 60 || p.x > G.camX + W + 60) continue;

      ctx.fillStyle = th.groundDark;
      ctx.fillRect(p.x, p.y + 5, p.w, p.h);
      ctx.fillStyle = th.ground;
      ctx.fillRect(p.x, p.y + 5, p.w, 6);
      ctx.fillStyle = th.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(p.x, p.y, p.w, 2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)';
      ctx.fillRect(p.x + 6, p.y + p.h + 5, p.w - 12, 4);
    }
  }

  // ============================================================
  //  场景物件
  // ============================================================
  function drawCoins() {
    for (var i = 0; i < COINS.length; i++) {
      var c = COINS[i];
      if (c.taken || c.x < G.camX - 40 || c.x > G.camX + W + 40) continue;
      var bob = Math.sin(c.bob) * 3;
      var sw = Math.max(0.22, Math.abs(Math.cos(c.bob * 0.85)));
      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.shadowColor = '#fbbf24';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(0, 0, 8 * sw, 8, 0, 0, 6.283);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.ellipse(-1.4, -1.8, 3.2 * sw, 3.4, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawChests() {
    for (var i = 0; i < CHESTS.length; i++) {
      var c = CHESTS[i];
      if (c.x + c.w < G.camX - 60 || c.x > G.camX + W + 60) continue;
      var bob = c.opened ? 0 : Math.sin(c.bob) * 1.5;

      if (!c.opened) {
        var gl = 0.18 + 0.12 * Math.sin(G.time * 3 + i);
        var gg = ctx.createRadialGradient(c.x + 20, c.y + 10, 2, c.x + 20, c.y + 10, 56);
        gg.addColorStop(0, 'rgba(251,191,36,' + gl + ')');
        gg.addColorStop(1, 'rgba(251,191,36,0)');
        ctx.fillStyle = gg;
        ctx.beginPath();
        ctx.arc(c.x + 20, c.y + 10, 56, 0, 6.283);
        ctx.fill();
      }

      ctx.save();
      ctx.translate(c.x, c.y + bob);
      ctx.fillStyle = '#6b3f1d';
      roundRect(0, 8, 40, 28, 4);
      ctx.fill();
      ctx.fillStyle = '#8a5326';
      roundRect(2, 10, 36, 12, 3);
      ctx.fill();

      if (c.opened) {
        ctx.save();
        ctx.translate(2, 8);
        ctx.rotate(-0.7);
        ctx.fillStyle = '#a1662f';
        roundRect(0, -12, 36, 12, 4);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#a1662f';
        roundRect(0, 0, 40, 14, 5);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        roundRect(3, 2, 34, 4, 2);
        ctx.fill();
      }

      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.strokeRect(1.5, 9, 37, 26);
      ctx.fillStyle = '#fbbf24';
      if (!c.opened) ctx.fillRect(17, 10, 6, 9);
      ctx.restore();
    }
  }

  function drawDrops() {
    for (var i = 0; i < DR.length; i++) {
      var d = DR[i];
      if (d.x < G.camX - 50 || d.x > G.camX + W + 50) continue;

      if (d.kind === 'coin') {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(0, 0, 5.5, 0, 6.283);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fde68a';
        ctx.beginPath();
        ctx.arc(-1.4, -1.6, 2, 0, 6.283);
        ctx.fill();
        ctx.restore();
      } else if (d.kind === 'xp') {
        var bobx = Math.sin(G.time * 5 + d.x * 0.03) * 2;
        ctx.save();
        ctx.translate(d.x, d.y + bobx);
        ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 14;
        ctx.fillStyle = '#8b5cf6';
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(7, 0); ctx.lineTo(0, 8); ctx.lineTo(-7, 0);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ede9fe';
        ctx.font = '700 8px "Segoe UI", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('XP', 0, 0.5);
        ctx.restore();
      } else if (d.kind === 'gear' && d.item) {
        var gc = qColor(d.item.quality);
        var bob = Math.sin(G.time * 4 + d.x * 0.02) * 2;
        ctx.save();
        ctx.translate(d.x, d.y + bob);
        ctx.shadowColor = gc; ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(10,10,18,0.92)';
        roundRect(-13, -13, 26, 26, 5);
        ctx.fill();
        ctx.strokeStyle = gc; ctx.lineWidth = 2; ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = gc;
        ctx.font = '700 14px "Segoe UI", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(d.item.slot === 'weapon' ? '⚔' : '🛡', 0, 1);
        ctx.restore();
      } else {
        var col = d.kind === 'hp' ? '#f87171' : '#60a5fa';
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.shadowColor = col;
        ctx.shadowBlur = 14;
        ctx.fillStyle = 'rgba(10,10,18,0.88)';
        roundRect(-7, -10, 14, 20, 4);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(0, 1, 4, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(-3, -14, 6, 5);
        ctx.restore();
      }
    }
  }

  function drawMerchant() {
    if (!G.merchant) return;
    var m = G.merchant;
    m.t = (m.t || 0) + 0.016;
    if (m.x < G.camX - 80 || m.x > G.camX + W + 80) return;
    var bob = Math.sin(G.time * 2.2) * 2;
    ctx.save();
    ctx.translate(m.x + m.w / 2, m.y + m.h);
    // 身体
    ctx.fillStyle = '#7c3aed';
    roundRect(-14, -44 + bob, 28, 34, 6); ctx.fill();
    // 头
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.arc(0, -50 + bob, 10, 0, Math.PI * 2); ctx.fill();
    // 帽子
    ctx.fillStyle = '#4c1d95';
    ctx.beginPath(); ctx.moveTo(-12, -54 + bob); ctx.lineTo(12, -54 + bob); ctx.lineTo(0, -70 + bob); ctx.closePath(); ctx.fill();
    // 招牌
    ctx.fillStyle = 'rgba(15,23,42,0.85)';
    roundRect(-26, -92 + bob, 52, 18, 5); ctx.fill();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#fbbf24';
    ctx.font = '700 11px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('商人 E', 0, -83 + bob);
    ctx.restore();
    if (typeof nearMerchant === 'function' && nearMerchant() && G.mode === 'playing') {
      ctx.save();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '700 13px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按 E 购买装备', m.x + m.w / 2, m.y - 98 + bob);
      ctx.restore();
    }
  }

  function drawPortal() {
    if (!G.portal) return;
    var p = G.portal;
    ctx.save();
    ctx.translate(p.x, p.y);

    var g = ctx.createRadialGradient(0, 0, 4, 0, 0, 52);
    g.addColorStop(0, 'rgba(237,233,254,0.95)');
    g.addColorStop(0.45, 'rgba(167,139,250,0.55)');
    g.addColorStop(1, 'rgba(139,92,246,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 52, 0, 0, 6.283);
    ctx.fill();

    for (var i = 0; i < 3; i++) {
      var rr = 36 + i * 11 + Math.sin(p.t * 3 + i) * 4;
      ctx.strokeStyle = 'rgba(196,181,253,' + (0.65 - i * 0.16).toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, rr * 0.62, rr, 0, 0, 6.283);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBarrier() {
    if (!G.bossActive) return;
    var x = G.barrierX;
    if (x < G.camX - 80 || x > G.camX + W + 80) return;

    var g = ctx.createLinearGradient(x - 16, 0, x + 16, 0);
    g.addColorStop(0, 'rgba(192,132,252,0)');
    g.addColorStop(0.5, 'rgba(192,132,252,0.42)');
    g.addColorStop(1, 'rgba(192,132,252,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 16, 30, 32, GROUND - 30);

    ctx.strokeStyle = 'rgba(216,180,254,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([11, 9]);
    ctx.lineDashOffset = -G.time * 46;
    ctx.beginPath();
    ctx.moveTo(x, 30);
    ctx.lineTo(x, GROUND);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // ============================================================
  //  玩家
  // ============================================================
  function drawPlayer() {
    if (!P) return;
    var c = cdef();
    var cx = P.x + P.w / 2;
    var feet = P.y + P.h;
    var airH = clamp((GROUND - feet) / 200, 0, 1);

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,' + (0.30 - airH * 0.18).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, GROUND - 4, 19 * (1 - airH * 0.35), 6 * (1 - airH * 0.35), 0, 0, 6.283);
    ctx.fill();

    if (P.invuln > 0 && Math.floor(G.time * 22) % 2 === 0) ctx.globalAlpha = 0.55;

    var swing = Math.sin(P.walkT * 9) * (Math.abs(P.vx) > 12 ? 1 : 0);
    var lean = P.attackT > 0 ? 3 : 0;

    ctx.save();
    ctx.translate(cx, feet);
    ctx.scale(P.face, 1);

    if (P.guardT > 0 || P.shieldHP > 0) {
      ctx.save();
      ctx.scale(P.face, 1);
      ctx.globalAlpha = 0.22 + 0.08 * Math.sin(G.time * 8);
      ctx.strokeStyle = '#93c5fd';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#60a5fa';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.ellipse(0, -P.h * 0.48, P.w * 0.95, P.h * 0.62, 0, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }

    if (G.cls === 'warrior') {
      // 腿
      ctx.fillStyle = '#475569';
      ctx.fillRect(-9, -16 + Math.max(0, swing) * 2, 7, 16);
      ctx.fillRect(2, -16 + Math.max(0, -swing) * 2, 7, 16);
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(-10, -3, 9, 3);
      ctx.fillRect(1, -3, 9, 3);
      // 身体
      ctx.fillStyle = '#94a3b8';
      roundRect(-11 + lean, -39, 22, 25, 5);
      ctx.fill();
      ctx.fillStyle = c.color;
      ctx.fillRect(-9 + lean, -31, 18, 12);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-11 + lean, -20, 22, 3);
      // 头
      ctx.fillStyle = '#f2c99b';
      ctx.beginPath();
      ctx.arc(lean, -46, 8, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(lean, -48, 9, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(-9 + lean, -48, 18, 3);
      // 羽饰
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.moveTo(-2 + lean, -57);
      ctx.lineTo(-15 + lean, -50);
      ctx.lineTo(-2 + lean, -48);
      ctx.closePath();
      ctx.fill();
      // 剑
      ctx.save();
      ctx.translate(10 + lean, -28);
      var sw = P.attackT > 0 ? (-1.15 + (1 - P.attackT / 0.24) * 2.1) : -0.55;
      ctx.rotate(sw);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, -2, 27, 4);
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(27, -2);
      ctx.lineTo(34, 0);
      ctx.lineTo(27, 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-4, -6, 5, 12);
      ctx.restore();
    } else if (G.cls === 'archer') {
      ctx.fillStyle = '#166534';
      ctx.fillRect(-8, -15 + Math.max(0, swing) * 2, 6, 15);
      ctx.fillRect(2, -15 + Math.max(0, -swing) * 2, 6, 15);
      ctx.fillStyle = '#14532d';
      ctx.fillRect(-9, -3, 8, 3);
      ctx.fillRect(1, -3, 8, 3);

      ctx.fillStyle = c.color;
      roundRect(-10 + lean, -37, 20, 23, 5);
      ctx.fill();
      ctx.fillStyle = '#065f46';
      ctx.fillRect(-10 + lean, -22, 20, 5);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-10 + lean, -20, 20, 2);

      // 兜帽
      ctx.fillStyle = '#059669';
      ctx.beginPath();
      ctx.arc(lean, -45, 10, 0, 6.283);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-9 + lean, -48);
      ctx.lineTo(-20 + lean, -56);
      ctx.lineTo(-6 + lean, -52);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f2c99b';
      ctx.beginPath();
      ctx.arc(2 + lean, -44, 6, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(4 + lean, -45, 1.4, 0, 6.283);
      ctx.fill();

      // 弓
      ctx.strokeStyle = '#a16207';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(15, -26, 15, -1.25, 1.25);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(15 + Math.cos(-1.25) * 15, -26 + Math.sin(-1.25) * 15);
      ctx.lineTo(15 + Math.cos(1.25) * 15, -26 + Math.sin(1.25) * 15);
      ctx.stroke();
      if (P.attackT > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(6, -26);
        ctx.lineTo(30, -26);
        ctx.stroke();
      }
      // 箭袋
      ctx.fillStyle = '#7c2d12';
      ctx.save();
      ctx.rotate(-0.3);
      ctx.fillRect(-14, -34, 7, 16);
      ctx.restore();
    } else {
      // 法师长袍
      ctx.fillStyle = '#4338ca';
      ctx.beginPath();
      ctx.moveTo(-10 + lean, -36);
      ctx.lineTo(10 + lean, -36);
      ctx.lineTo(16, 0);
      ctx.lineTo(-16, 0);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#6366f1';
      ctx.beginPath();
      ctx.moveTo(-8 + lean, -36);
      ctx.lineTo(8 + lean, -36);
      ctx.lineTo(12, -8);
      ctx.lineTo(-12, -8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-16, -4, 32, 3);

      ctx.fillStyle = '#f2c99b';
      ctx.beginPath();
      ctx.arc(lean, -43, 7, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#e0e7ff';
      ctx.beginPath();
      ctx.moveTo(-6 + lean, -38);
      ctx.lineTo(0 + lean, -31);
      ctx.lineTo(6 + lean, -38);
      ctx.closePath();
      ctx.fill();

      // 尖帽
      ctx.fillStyle = '#4f46e5';
      ctx.beginPath();
      ctx.moveTo(-14 + lean, -47);
      ctx.lineTo(-1 + lean, -70);
      ctx.lineTo(12 + lean, -47);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(-16 + lean, -48, 30, 3);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(1 + lean, -60, 2.4, 0, 6.283);
      ctx.fill();

      // 法杖
      ctx.strokeStyle = '#a16207';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.lineTo(14, -48);
      ctx.stroke();
      var pulse = 0.7 + 0.3 * Math.sin(G.time * 4);
      ctx.save();
      ctx.shadowColor = '#a5b4fc';
      ctx.shadowBlur = 16 * pulse;
      ctx.fillStyle = '#c7d2fe';
      ctx.beginPath();
      ctx.arc(14, -52, 5 * pulse + 1, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
    ctx.globalAlpha = 1;

    // 冲锋残影
    if (P.chargeT > 0) {
      for (var ci = 1; ci <= 3; ci++) {
        ctx.globalAlpha = 0.15 * (4 - ci);
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.ellipse(cx - P.chargeDir * ci * 20, P.y + P.h / 2, 15, 23, 0, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 施法光晕
    if (P.castT > 0) {
      var ca = clamp(P.castT / 0.24, 0, 1);
      ctx.save();
      ctx.globalAlpha = ca * 0.45;
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(cx, P.y + P.h * 0.45, 30 + (1 - ca) * 22, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  }
  function drawMonsters() {
    for (var i = 0; i < M.length; i++) {
      var m = M[i];
      if (!m || m.dead) continue;
      if (m.x + m.w < G.camX - 100 || m.x > G.camX + W + 100) continue;
      drawMonster(m);
    }
  }

  function drawMonster(m) {
    var cx = m.x + m.w / 2;
    var feet = m.y + m.h;
    var col = m.slowT > 0 ? '#93c5fd' : null;

    if (m.kind !== 'fly') {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(cx, GROUND - 4, m.w * 0.48, 5, 0, 0, 6.283);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(cx, feet);

    if (m.type === 'slime') {
      var squash = m.onGround ? 1 + Math.sin(m.t * 6) * 0.04 : 0.86;
      ctx.fillStyle = col || '#4ade80';
      ctx.beginPath();
      ctx.ellipse(0, -m.h * 0.5 * squash, m.w * 0.5, m.h * 0.55 * squash, 0, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.ellipse(-m.w * 0.16, -m.h * 0.72, m.w * 0.14, m.h * 0.14, 0, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0b2016';
      var ex = m.face * 4;
      ctx.beginPath();
      ctx.arc(-6 + ex, -m.h * 0.55, 2.6, 0, 6.283);
      ctx.arc(6 + ex, -m.h * 0.55, 2.6, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = '#0b2016';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0 + ex, -m.h * 0.38, 4, 0.2, Math.PI - 0.2);
      ctx.stroke();
    } else if (m.type === 'bat') {
      var flap = Math.sin(m.t * 16) * 0.55;
      ctx.fillStyle = col || '#7c3aed';
      ctx.save();
      ctx.translate(-m.w * 0.34, -m.h * 0.6);
      ctx.rotate(-flap);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-20, -12);
      ctx.lineTo(-16, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.translate(m.w * 0.34, -m.h * 0.6);
      ctx.rotate(flap);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(20, -12);
      ctx.lineTo(16, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = col || '#a78bfa';
      ctx.beginPath();
      ctx.ellipse(0, -m.h * 0.55, m.w * 0.28, m.h * 0.34, 0, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(-3, -m.h * 0.62, 2, 0, 6.283);
      ctx.arc(4, -m.h * 0.62, 2, 0, 6.283);
      ctx.fill();
    } else if (m.type === 'skeleton') {
      var wind = m.state === 'wind';
      ctx.strokeStyle = col || '#e2e8f0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-6, 0); ctx.lineTo(-6, -14);
      ctx.moveTo(6, 0); ctx.lineTo(6, -14);
      ctx.stroke();
      ctx.fillStyle = col || '#e2e8f0';
      ctx.fillRect(-8, -30, 16, 17);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      for (var r = 0; r < 3; r++) {
        ctx.beginPath();
        ctx.moveTo(-7, -27 + r * 5);
        ctx.lineTo(7, -27 + r * 5);
        ctx.stroke();
      }
      ctx.fillStyle = col || '#f1f5f9';
      ctx.beginPath();
      ctx.arc(0, -39, 8, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-3, -40, 2.2, 0, 6.283);
      ctx.arc(4, -40, 2.2, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-2, -34, 5, 2);
      // 剑
      ctx.save();
      ctx.translate(8, -24);
      ctx.rotate(wind ? -2.1 : -0.5);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(0, -2, 26, 4);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(-3, -5, 4, 10);
      ctx.restore();
    } else if (m.type === 'mage') {
      ctx.fillStyle = col || '#4c1d95';
      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.lineTo(10, 0);
      ctx.lineTo(7, -32);
      ctx.lineTo(-7, -32);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = col || '#6d28d9';
      ctx.beginPath();
      ctx.arc(0, -38, 9, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(0, -36, 5, 4, 0, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(-2, -37, 1.4, 0, 6.283);
      ctx.arc(3, -37, 1.4, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(12, -34);
      ctx.stroke();
      var pp = 0.6 + 0.4 * Math.sin(G.time * 5);
      ctx.save();
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f9a8d4';
      ctx.beginPath();
      ctx.arc(12, -38, 4 * pp + 1, 0, 6.283);
      ctx.fill();
      ctx.restore();
    } else if (m.type === 'golem') {
      var slam = m.state === 'slam';
      ctx.fillStyle = col || '#78716c';
      roundRect(-m.w * 0.42, -m.h, m.w * 0.84, m.h, 8);
      ctx.fill();
      ctx.fillStyle = col || '#57534e';
      roundRect(-m.w * 0.5, -m.h * 0.72, m.w * 0.2, m.h * 0.5, 6);
      ctx.fill();
      roundRect(m.w * 0.3, -m.h * 0.72, m.w * 0.2, m.h * 0.5, 6);
      ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(-6, -m.h * 0.62, 4, 4);
      ctx.fillRect(4, -m.h * 0.62, 4, 4);
      ctx.strokeStyle = 'rgba(251,191,36,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, -m.h * 0.5);
      ctx.lineTo(-2, -m.h * 0.34);
      ctx.lineTo(-12, -m.h * 0.2);
      ctx.stroke();
      if (slam) {
        ctx.fillStyle = 'rgba(251,191,36,0.8)';
        ctx.beginPath();
        ctx.arc(0, -m.h * 0.2, 6 + Math.sin(G.time * 30) * 2, 0, 6.283);
        ctx.fill();
      }
    }

    if (m.flash > 0) {
      ctx.globalAlpha = Math.min(0.75, m.flash * 6);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, -m.h * 0.55, m.w * 0.5, m.h * 0.55, 0, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (m.hp < m.maxHp) {
      var bw = Math.max(30, m.w * 1.1);
      var bx = cx - bw / 2;
      var by = m.y - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(bx, by, bw * clamp(m.hp / m.maxHp, 0, 1), 4);
    }
  }

  function drawBoss() {
    var b = G.boss;
    if (!b) return;
    var cx = b.x + b.w / 2;
    var feet = b.y + b.h;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';

      ctx.fillStyle = '#0b2016';

      ctx.fillStyle = '#fff';

      ctx.lineTo(-30, 0);

      ctx.strokeStyle = '#e2e8f0';

      ctx.moveTo(9, 0); ctx.lineTo(9, -b.h * 0.3);

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-14, -b.h * 0.62, 28, b.h * 0.32);
      ctx.strokeStyle = '#94a3b8';

      for (var r2 = 0; r2 < 4; r2++) {
        ctx.beginPath();
        ctx.moveTo(-12, -b.h * 0.58 + r2 * 8);
        ctx.lineTo(12, -b.h * 0.58 + r2 * 8);
        ctx.stroke();
      }
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.arc(0, -b.h * 0.76, 13, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();

      ctx.fillRect(0, -4, 62, 8);

    } else if (b.type === 'darkknight') {

      // 身体

      roundRect(-18, -b.h * 0.72, 36, b.h * 0.44, 8);

      ctx.fillStyle = '#a78bfa';

      ctx.fillStyle = '#f43f5e';

      ctx.ellipse(0, -b.h * 0.4, b.w * 0.26, b.h * 0.32, 0, 0, 6.283);

      ctx.closePath();
      ctx.fill();
      // 火舌
      for (var f = 0; f < 3; f++) {

        ctx.fillStyle = 'rgba(251,146,60,' + (0.35 + 0.25 * Math.sin(G.time * 7 + f)) + ')';
        ctx.beginPath();
        ctx.moveTo(-b.w * 0.4, fy);
        ctx.quadraticCurveTo(-b.w * 0.55, fy - 20, -b.w * 0.3, fy - 34);

    } else {

      ctx.lineTo(-52, -40);
      ctx.lineTo(-42, 26);

      ctx.restore();
      ctx.save();
      ctx.translate(30, -b.h * 0.72);
      ctx.rotate(flap2);
      ctx.fillStyle = 'rgba(76,29,149,0.9)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(52, -40);

      ctx.fillStyle = '#1e1b4b';
