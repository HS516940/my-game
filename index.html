      ctx.fillStyle = '#4c1d95';
      ctx.beginPath();
      ctx.ellipse(0, -b.h * 0.4, b.w * 0.2, b.h * 0.28, 0, 0, 6.283);
      ctx.fill();
      // 头
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.arc(0, -b.h * 0.8, 23, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(-8, -b.h * 0.81, 5, 0, 6.283);
      ctx.arc(9, -b.h * 0.81, 5, 0, 6.283);
      ctx.fill();
      // 角
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath();
      ctx.moveTo(-16, -b.h * 0.88);
      ctx.lineTo(-34, -b.h * 1.04);
      ctx.lineTo(-8, -b.h * 0.96);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(16, -b.h * 0.88);
      ctx.lineTo(34, -b.h * 1.04);
      ctx.lineTo(8, -b.h * 0.96);
      ctx.closePath();
      ctx.fill();
      // 皇冠
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(-16, -b.h * 0.94);
      ctx.lineTo(-16, -b.h * 1.04);
      ctx.lineTo(-6, -b.h * 0.99);
      ctx.lineTo(0, -b.h * 1.08);
      ctx.lineTo(6, -b.h * 0.99);
      ctx.lineTo(16, -b.h * 1.04);
      ctx.lineTo(16, -b.h * 0.94);
      ctx.closePath();
      ctx.fill();
    }

    if (b.flash > 0) {
      ctx.globalAlpha = Math.min(0.7, b.flash * 6);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, -b.h * 0.5, b.w * 0.5, b.h * 0.5, 0, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // ============================================================
  //  弹道 / 区域 / 特效
  // ============================================================
  function drawShots() {
    for (var i = 0; i < PR.length; i++) {
      var s = PR[i];
      if (s.x < G.camX - 80 || s.x > G.camX + W + 80) continue;

      ctx.save();
      ctx.translate(s.x, s.y);

      if (s.kind === 'arrow') {
        ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.strokeStyle = '#d9f99d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(10, 0);
        ctx.stroke();
        ctx.fillStyle = '#a3e635';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(4, -4);
        ctx.lineTo(4, 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.moveTo(-12, 0);
        ctx.lineTo(-8, -4);
        ctx.moveTo(-12, 0);
        ctx.lineTo(-8, 4);
        ctx.stroke();
      } else if (s.kind === 'bolt') {
        var bg = ctx.createRadialGradient(0, 0, 1, 0, 0, 15);
        bg.addColorStop(0, '#ffffff');
        bg.addColorStop(0.4, '#a5b4fc');
        bg.addColorStop(1, 'rgba(129,140,248,0)');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#e0e7ff';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, 6.283);
        ctx.fill();
      } else if (s.kind === 'snipe') {
        ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.save();
        ctx.shadowColor = '#fde68a'; ctx.shadowBlur = 22;
        ctx.fillStyle = 'rgba(254,240,138,0.4)';
        ctx.beginPath(); ctx.moveTo(-56, -4); ctx.lineTo(18, 0); ctx.lineTo(-56, 4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fffbeb'; ctx.fillRect(-34, -1.8, 50, 3.6);
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(6, -8); ctx.lineTo(6, 8); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (s.kind === 'frost') {
        ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.save();
        ctx.shadowColor = '#67e8f9'; ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(165,243,252,0.4)';
        ctx.beginPath(); ctx.moveTo(-40, -5); ctx.lineTo(14, 0); ctx.lineTo(-40, 5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-28, 0); ctx.lineTo(12, 0); ctx.stroke();
        ctx.fillStyle = '#67e8f9';
        ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(2, -7); ctx.lineTo(2, 7); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (s.kind === 'split') {
        ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.save();
        ctx.shadowColor = '#86efac'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#bbf7d0';
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -4); ctx.lineTo(-4, 0); ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (s.kind === 'pierce') {
        ctx.rotate(Math.atan2(s.vy, s.vx));
        ctx.save();
        ctx.shadowColor = '#86efac';
        ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(187,247,208,0.35)';
        ctx.beginPath();
        ctx.moveTo(-46, -5);
        ctx.lineTo(14, 0);
        ctx.lineTo(-46, 5);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#dcfce7';
        ctx.fillRect(-30, -1.6, 42, 3.2);
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.moveTo(16, 0);
        ctx.lineTo(4, -7);
        ctx.lineTo(4, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else if (s.kind === 'blast') {
        var bgg = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
        bgg.addColorStop(0, '#fff7ed');
        bgg.addColorStop(0.4, '#fb923c');
        bgg.addColorStop(1, 'rgba(239,68,68,0)');
        ctx.fillStyle = bgg;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 6.283);
        ctx.fill();
        ctx.strokeStyle = 'rgba(251,191,36,0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 10 + Math.sin(G.time * 26) * 2, 0, 6.283);
        ctx.stroke();
      } else if (s.kind === 'bone') {
        ctx.rotate(s.spin);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(-9, -3, 18, 6);
        ctx.beginPath();
        ctx.arc(-9, -3, 3, 0, 6.283);
        ctx.arc(-9, 3, 3, 0, 6.283);
        ctx.arc(9, -3, 3, 0, 6.283);
        ctx.arc(9, 3, 3, 0, 6.283);
        ctx.fill();
      } else if (s.kind === 'wave') {
        ctx.scale(s.vx > 0 ? 1 : -1, 1);
        ctx.strokeStyle = 'rgba(192,132,252,0.9)';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(-6, 0, 22, -1.1, 1.1);
        ctx.stroke();
      } else if (s.kind === 'fire') {
        var fg = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
        fg.addColorStop(0, '#fff7ed');
        fg.addColorStop(0.4, '#fb923c');
        fg.addColorStop(1, 'rgba(239,68,68,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, 6.283);
        ctx.fill();
      } else if (s.kind === 'meteor') {
        ctx.fillStyle = 'rgba(251,146,60,0.4)';
        ctx.beginPath();
        ctx.ellipse(0, -14, 8, 22, 0, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(-2, -2, 4, 0, 6.283);
        ctx.fill();
      } else if (s.kind === 'dark') {
        var dg = ctx.createRadialGradient(0, 0, 2, 0, 0, 15);
        dg.addColorStop(0, '#f5d0fe');
        dg.addColorStop(0.4, '#a855f7');
        dg.addColorStop(1, 'rgba(88,28,135,0)');
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, 6.283);
        ctx.fill();
      } else {
        var og = ctx.createRadialGradient(0, 0, 2, 0, 0, 13);
        og.addColorStop(0, '#ffffff');
        og.addColorStop(0.45, '#67e8f9');
        og.addColorStop(1, 'rgba(34,211,238,0)');
        ctx.fillStyle = og;
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, 6.283);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawZones() {
    for (var i = 0; i < ZN.length; i++) {
      var z = ZN[i];
      var p = 1 - z.t / z.max;

      if (z.type === 'rain') {
        ctx.save();
        ctx.strokeStyle = 'rgba(74,222,128,0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([9, 9]);
        ctx.strokeRect(z.x - z.w / 2, GROUND - 200, z.w, 200);
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(74,222,128,0.10)';
        ctx.fillRect(z.x - z.w / 2, GROUND - 200, z.w, 200);
        if (z.lock) {
          ctx.strokeStyle = 'rgba(74,222,128,0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(z.x, GROUND - 14, 26 + Math.sin(G.time * 8) * 3, 0, 6.283);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(z.x - 36, GROUND - 14); ctx.lineTo(z.x - 20, GROUND - 14);
          ctx.moveTo(z.x + 20, GROUND - 14); ctx.lineTo(z.x + 36, GROUND - 14);
          ctx.stroke();
        }
        ctx.restore();
      } else if (z.type === 'nova') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.strokeStyle = z.c1 || '#a5f3fc';
        ctx.lineWidth = 6 * (1 - p) + 1;
        ctx.shadowColor = z.c2 || '#67e8f9';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.maxR * p, 0, 6.283);
        ctx.stroke();
        ctx.restore();
      } else if (z.type === 'firestorm') {
        ctx.save();
        ctx.globalAlpha = 0.55;
        var fg = ctx.createLinearGradient(0, GROUND - 140, 0, GROUND);
        fg.addColorStop(0, 'rgba(251,146,60,0.02)');
        fg.addColorStop(0.5, 'rgba(239,68,68,0.22)');
        fg.addColorStop(1, 'rgba(251,191,36,0.18)');
        ctx.fillStyle = fg;
        ctx.fillRect(z.x - z.w / 2, GROUND - 140, z.w, 140);
        ctx.strokeStyle = 'rgba(251,146,60,0.6)';
        ctx.lineWidth = 2;
        ctx.strokeRect(z.x - z.w / 2, GROUND - 140, z.w, 140);
        if (z.lock) {
          ctx.fillStyle = '#fb923c';
          ctx.beginPath(); ctx.arc(z.x, GROUND - 14, 5, 0, 6.283); ctx.fill();
        }
        ctx.restore();
      } else if (z.type === 'bolt_strike') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.strokeStyle = '#fde68a';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 22;
        ctx.lineWidth = 4 * (1 - p) + 1;
        ctx.beginPath();
        ctx.moveTo(z.x, 40);
        for (var bsi = 1; bsi < 6; bsi++) ctx.lineTo(z.x + rand(-18, 18), lerp(40, GROUND, bsi / 6));
        ctx.lineTo(z.x, GROUND);
        ctx.stroke();
        ctx.restore();
      } else if (z.type === 'ring') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.strokeStyle = z.color || '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r * p, 0, 6.283);
        ctx.stroke();
        ctx.restore();
      } else if (z.type === 'burst') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, (1 - p) * 0.55);
        ctx.fillStyle = z.color || '#ffffff';
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r * (0.4 + p * 0.7), 0, 6.283);
        ctx.fill();
        ctx.restore();
      } else if (z.type === 'warn') {
        ctx.save();
        ctx.globalAlpha = 0.20 + 0.12 * Math.sin(G.time * 26);
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(z.x - z.w / 2, GROUND - 120, z.w, 120);
        ctx.restore();
      } else if (z.type === 'pillar') {
        ctx.save();
        var pulse = 0.35 + 0.3 * Math.sin(G.time * 18);
        ctx.strokeStyle = 'rgba(251,146,60,' + pulse.toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(z.x, GROUND - 6, 64, 16, 0, 0, 6.283);
        ctx.stroke();
        ctx.fillStyle = 'rgba(251,146,60,0.12)';
        ctx.fillRect(z.x - 52, GROUND - 150, 104, 150);
        ctx.restore();
      } else if (z.type === 'meteor') {
        ctx.save();
        var mp = clamp(1 - z.t / z.max, 0, 1);
        ctx.strokeStyle = 'rgba(251,146,60,0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(z.x, GROUND - 6, 150 * (0.35 + mp * 0.65), 26 * (0.35 + mp * 0.65), 0, 0, 6.283);
        ctx.stroke();
        var my = lerp(-110, GROUND - 70, mp * mp);
        ctx.shadowColor = '#fb923c';
        ctx.shadowBlur = 28;
        ctx.fillStyle = 'rgba(251,146,60,0.45)';
        ctx.beginPath();
        ctx.ellipse(z.x, my - 40, 13, 40, 0, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.arc(z.x, my, 17, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(z.x - 4, my - 4, 7, 0, 6.283);
        ctx.fill();
        ctx.restore();
      } else if (z.type === 'chain') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.strokeStyle = '#c4b5fd';
        ctx.shadowColor = '#a78bfa';
        ctx.shadowBlur = 18;
        ctx.lineWidth = 3;
        for (var ci2 = 1; ci2 < z.pts.length; ci2++) {
          var a1 = z.pts[ci2 - 1], b1 = z.pts[ci2];
          ctx.beginPath();
          ctx.moveTo(a1.x, a1.y);
          for (var q = 1; q <= 4; q++) {
            var tq = q / 4;
            var jx = q === 4 ? 0 : rand(-7, 7);
            var jy = q === 4 ? 0 : rand(-7, 7);
            ctx.lineTo(lerp(a1.x, b1.x, tq) + jx, lerp(a1.y, b1.y, tq) + jy);
          }
          ctx.stroke();
        }
        ctx.fillStyle = '#ede9fe';
        for (var ci3 = 0; ci3 < z.pts.length; ci3++) {
          ctx.beginPath();
          ctx.arc(z.pts[ci3].x, z.pts[ci3].y, 4.5, 0, 6.283);
          ctx.fill();
        }
        ctx.restore();
      } else if (z.type === 'quake') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p);
        ctx.strokeStyle = z.color || '#fbbf24';
        ctx.lineWidth = 6 * (1 - p) + 1;
        ctx.beginPath();
        ctx.ellipse(z.x, z.y, z.r * p, z.r * p * 0.22, 0, 0, 6.283);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawSwings() {
    for (var i = 0; i < SW.length; i++) {
      var s = SW[i];
      var p = 1 - s.t / s.max;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.scale(s.face, 1);
      ctx.globalAlpha = Math.max(0, 1 - p) * 0.85;
      ctx.strokeStyle = s.enemy ? '#fca5a5' : '#fde68a';
      ctx.lineWidth = 5 * (1 - p) + 1;
      ctx.shadowColor = s.enemy ? '#ef4444' : '#fbbf24';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(0, 0, 44 + p * 14, -1.15, 1.15);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (var i = 0; i < PT.length; i++) {
      var p = PT[i];
      var a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a + 0.3, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < TX.length; i++) {
      var t = TX[i];
      var a = Math.min(1, t.life * 2.4);
      ctx.globalAlpha = a;
      ctx.font = '800 ' + t.size + 'px "Cascadia Code", "Consolas", monospace';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(t.text, t.x + 1.5, t.y + 1.5);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
  // ============================================================
  //  HUD
  // ============================================================
  function drawBar(x, y, w, h, frac, fg, bg, text) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(x - 1.5, y - 1.5, w + 3, h + 3, 4);
    ctx.fill();
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, w, h);
    var fw = w * clamp(frac, 0, 1);
    ctx.fillStyle = fg;
    ctx.fillRect(x, y, fw, h);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fillRect(x, y, fw, Math.max(2, h * 0.36));
    if (text) {
      ctx.font = '700 10.5px "Cascadia Code", "Consolas", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
    }
  }

  function drawHUD() {
    var c = cdef();

    drawBar(20, 14, 250, 18, G.hp / maxHp(), '#ef4444', '#3b1218',
      Math.ceil(G.hp) + ' / ' + Math.round(maxHp()));
    drawBar(20, 38, 200, 12, G.mp / maxMp(), '#3b82f6', '#12203f', '');
    drawBar(20, 56, 200, 5, G.xp / G.xpNext, '#a3e635', 'rgba(255,255,255,0.10)', '');

    ctx.font = '800 13px "Cascadia Code", "Consolas", monospace';
    ctx.fillStyle = '#fbbf24';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('Lv.' + G.level, 228, 44);

    // 金币
    ctx.save();
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(W - 112, 24, 9, 0, 6.283);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fde68a';
    ctx.beginPath();
    ctx.arc(W - 114, 22, 3.4, 0, 6.283);
    ctx.fill();
    ctx.font = '800 17px "Cascadia Code", "Consolas", monospace';
    ctx.fillStyle = '#fbbf24';
    ctx.textAlign = 'left';
    ctx.fillText(String(G.coins), W - 98, 25);
    ctx.restore();

    // 关卡名 / BOSS 血条
    if (G.boss) {
      drawBar(280, 14, 400, 16, G.boss.hp / G.boss.maxHp, '#f43f5e', '#3f1216', '');
      ctx.font = '700 12px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#fecdd3';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS · ' + G.boss.name, W / 2, 40);
    } else {
      ctx.font = '700 12px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(226,232,240,0.72)';
      ctx.textAlign = 'center';
      ctx.fillText(G.stage.name + ' · ' + G.stage.sub, W / 2, 24);
    }

    // 技能栏
    var keyLabels = ['K', 'L', ';', 'O'];
    var bx0 = 14, by = H - 68, bw = 148, bh = 52, gap = 6;
    for (var si = 0; si < c.skills.length; si++) {
      var sk2 = c.skills[si];
      var bx = bx0 + si * (bw + gap);
      var cd = P ? (P.cds[si] || 0) : 0;
      var unlocked = skillUnlocked(si);
      var noMp = unlocked && G.mp < sk2.mp;

      ctx.fillStyle = unlocked ? 'rgba(8,8,14,0.68)' : 'rgba(8,8,14,0.5)';
      roundRect(bx, by, bw, bh, 9);
      ctx.fill();
      ctx.strokeStyle = !unlocked ? 'rgba(255,255,255,0.06)' : (cd > 0 ? 'rgba(255,255,255,0.10)' : (noMp ? 'rgba(96,165,250,0.30)' : 'rgba(255,255,255,0.16)'));
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = !unlocked ? 'rgba(100,116,139,0.5)' : (cd > 0 ? 'rgba(120,130,150,0.55)' : c.color);
      ctx.beginPath();
      ctx.arc(bx + 20, by + 26, 12, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = !unlocked ? '#94a3b8' : '#0b0b12';
      ctx.font = '800 11px "Cascadia Code", "Consolas", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(unlocked ? keyLabels[si] : '锁', bx + 20, by + 26.5);

      ctx.textAlign = 'left';
      ctx.fillStyle = !unlocked ? 'rgba(148,163,184,0.55)' : (cd > 0 ? 'rgba(203,213,225,0.55)' : '#e9edf6');
      ctx.font = '700 12px "PingFang SC", "Microsoft YaHei", sans-serif';
      var label = sk2.name + (sk2.survival ? '·保命' : '');
      ctx.fillText(label, bx + 37, by + 17);

      ctx.fillStyle = !unlocked ? 'rgba(148,163,184,0.45)' : ((noMp && cd <= 0) ? '#93c5fd' : '#60a5fa');
      ctx.font = '600 9px "Cascadia Code", "Consolas", monospace';
      ctx.fillText(unlocked ? (sk2.mp + '蓝 ' + sk2.cd.toFixed(1) + 's') : ('Lv.' + sk2.unlock + ' 解锁'), bx + 37, by + 35);

      if (unlocked && cd > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.66)';
        roundRect(bx, by, bw, bh, 9);
        ctx.fill();
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '800 15px "Cascadia Code", "Consolas", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(cd.toFixed(1), bx + bw / 2, by + bh / 2);
      } else if (noMp) {
        ctx.fillStyle = 'rgba(8,14,30,0.58)';
        roundRect(bx, by, bw, bh, 9);
        ctx.fill();
        ctx.fillStyle = '#93c5fd';
        ctx.font = '700 11px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('蓝量不足', bx + bw / 2, by + bh / 2 + 1);
      }
    }

    // 装备 + 护盾
    ctx.textAlign = 'right';
    ctx.font = '600 11px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(148,163,184,0.85)';
    ctx.fillText(weaponName() + ' · ' + armorName() + '  攻' + Math.round(atkVal()) + ' 防' + Math.round(defVal()) + '  (B背包)', W - 16, H - 18);
    if (P) {
      ctx.textAlign = 'left';
      var scd = P.shieldCd || 0;
      ctx.fillStyle = scd > 0 ? 'rgba(148,163,184,0.7)' : '#93c5fd';
      ctx.fillText('S护盾' + (scd > 0 ? ' ' + scd.toFixed(1) + 's' : (P.shieldHP > 0 ? ' ' + Math.round(P.shieldHP) : ' 就绪')), 226, 44);
    }

    // 屏幕下方：已佩戴装备词条
    drawEquipAffixes();
  }

  function drawEquipAffixes() {
    if (!G || !G.equip) return;
    var y1 = H - 106, y2 = H - 90, hh = 14;
    ctx.save();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '600 10px "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif';
    function line(label, it, y) {
      var aff = (it && typeof gearAffixText === 'function') ? gearAffixText(it) : '';
      var txt = label + (it ? (' [' + qName(it.quality) + ']' + it.name) : '无') + '  ' + (aff ? ('词条: ' + aff) : '');
      if (txt.length > 118) txt = txt.slice(0, 117) + '…';
      var tw = ctx.measureText(txt).width + 12;
      var mw = Math.min(W - 20, Math.max(120, tw));
      ctx.fillStyle = 'rgba(8,8,14,0.58)';
      roundRect(10, y - hh / 2, mw, hh, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.stroke();
      ctx.fillStyle = it ? qColor(it.quality) : '#94a3b8';
      ctx.fillText(txt, 16, y + 0.5);
    }
    line('⚔', G.equip.weapon, y1);
    line('🛡', G.equip.armor, y2);
    ctx.restore();
  }

  function drawToast() {
    if (!G.toast) return;
    var t = G.toast;
    var a = Math.min(1, t.t * 2);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '700 14px "PingFang SC", "Microsoft YaHei", sans-serif';
    var tw = ctx.measureText(t.text).width;
    ctx.fillStyle = 'rgba(6,6,12,0.84)';
    roundRect(W / 2 - tw / 2 - 18, 82, tw + 36, 32, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = t.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.text, W / 2, 98);
    ctx.restore();
  }

  // ============================================================
  //  总绘制
  // ============================================================
  var vignette = null;

  function draw() {
    if (!G.stage) return;

    drawBackground();

    ctx.save();
    if (G.shake > 0.4) {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
    }
    ctx.translate(-G.camX, 0);

    drawGround();
    drawPlatforms();
    drawBarrier();
    drawCoins();
    drawChests();
    drawDrops();
    drawMerchant();
    drawPortal();
    drawMonsters();
    drawBoss();
    if (P && G.mode !== 'title') drawPlayer();
    drawSwings();
    drawShots();
    drawZones();
    drawParticles();
    drawTexts();

    ctx.restore();

    if (G.mode !== 'title' && G.mode !== 'win') drawHUD();
    drawToast();

    if (G.flash > 0) {
      ctx.fillStyle = 'rgba(244,63,94,' + (G.flash * 0.4).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (!vignette) {
      vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.95);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.48)');
    }
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  // ============================================================
  //  更新
  // ============================================================
  function update(dt) {
    G.time += dt;
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
    if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.0);
    if (G.hitStop > 0) { G.hitStop -= dt; return; }

    if (G.mode !== 'playing' || !P) return;

    updatePlayer(dt);
    updateMonsters(dt);
    if (G.mode !== 'playing') return;
    updateBoss(dt);
    if (G.mode !== 'playing') return;
    updateShots(dt);
    updateDrops(dt);
    updateCoins(dt);
    updateChests(dt);
    updateZones(dt);
    updateSwings(dt);
    updateParticles(dt);
    updateStageFlow(dt);
    updateCamera(dt);
  }

  // ---- 商人 NPC（每关开局出现，用金币购买装备）----
  function gearCost(it) {
    var base = [45, 95, 180, 320][clamp(it.quality, 0, 3)] || 60;
    return Math.round(base + gearScore(it) * 1.6);
  }

  function rollMerchantStock() {
    var si = G.stageIndex;
    var stock = [];
    var slots = ['weapon','armor','weapon','armor','weapon','armor'];
    for (var i = 0; i < 6; i++) {
      var r = Math.random(), q = 0;
      if (si >= 4) q = r < 0.08 ? 3 : (r < 0.32 ? 2 : (r < 0.78 ? 1 : 0));
      else if (si >= 3) q = r < 0.04 ? 3 : (r < 0.22 ? 2 : (r < 0.68 ? 1 : 0));
      else if (si >= 1) q = r < 0.10 ? 2 : (r < 0.48 ? 1 : 0);
      else q = r < 0.18 ? 1 : 0;
      var item = makeGearDrop(slots[i], q, G.cls);
      stock.push({ id: 'm' + i + '_' + Math.floor(Math.random()*9999), item: item, cost: gearCost(item), sold: false });
    }
    // 保底：至少一件武器一件护甲
    stock[0].item = makeGearDrop('weapon', clamp(Math.max(si - 1, 0), 0, 2), G.cls); stock[0].cost = gearCost(stock[0].item);
    stock[1].item = makeGearDrop('armor', clamp(Math.max(si - 1, 0), 0, 2), G.cls); stock[1].cost = gearCost(stock[1].item);
    return stock;
  }

      x: 230, y: GROUND - 52, w: 34, h: 52, t: 0,
      stock: rollMerchantStock()
    };

    if (!G.merchant || !P) return false;

    if (!G.merchant || !G.merchant.stock[idx]) return;
    var ent = G.merchant.stock[idx];
    if (ent.sold) return;
    if (G.coins < ent.cost) { toast('金币不足', '#f87171'); return; }
    G.coins -= ent.cost;
    ent.sold = true;
    var it = ent.item;
    // 购买后放入背包（低阶直接回收）；玩家按B自行装备
    if (isLowTierGear(it)) {
      var sv = recycleValue(it);
      G.coins += sv;
      toast('低阶装备直接回收 +' + sv, '#94a3b8');
      sfx.coin();
    } else {
      ensureBag();
      it._uid = it._uid || ('g' + Date.now() + '_' + Math.floor(Math.random() * 9999));
      G.bag.push(it);
      toast('已购入背包：[' + qName(it.quality) + '] ' + it.name, qColor(it.quality));
      sfx.buy();
    }
    renderMerchantShop();
  }

  function recycleAllBag() {
    ensureBag();
    if (!G.bag.length) { toast('背包为空', '#94a3b8'); return; }
    var total = 0, n = G.bag.length;
    for (var i = 0; i < G.bag.length; i++) total += recycleValue(G.bag[i]);
    G.bag.length = 0;
    G.coins += total;
    toast('一键回收 ' + n + ' 件，+' + total + ' 金币', '#4ade80');
    sfx.coin();
    if (G.mode === 'bag') renderBag();
  }

  function buy(id) {
    if (!G.merchant) return;
    var idx = -1; for (var i=0;i<G.merchant.stock.length;i++) if (G.merchant.stock[i].id===id || String(i)===String(id) || G.merchant.stock[i].id===('m'+id)) idx=i;

    if (idx >= 0) buyMerchant(idx);

  function nextStage() {
    var idx = G.stageIndex + 1;
    if (idx >= STAGES.length) { showWin(); return; }
    buildStage(idx);
    G.hp = maxHp();
    G.mp = maxMp();
    G.mode = 'playing';
    hideOverlay();
    banner(G.stage.name, G.stage.sub);
    ensureAudio();
  }

  // ============================================================
  //  暂停 / 失败 / 通关
  // ============================================================
  function togglePause() {
    if (G.mode === 'playing') {
      G.mode = 'paused';
      showOverlay(
        '<div class="tag">Paused</div><h2>暂停中</h2>' +
        '<p>' + G.stage.name + ' · Lv.' + G.level + ' · 金币 ' + G.coins + '</p>' +
        '<div class="row">' +
          '<button class="btn" id="btnResume">继续</button>' +
          '<button class="btn ghost" id="btnRestart">重新挑战本关</button>' +
          '<button class="btn ghost" id="btnTitle">回到标题</button>' +
        '</div>'
      );
      document.getElementById('btnResume').addEventListener('click', togglePause);
      document.getElementById('btnRestart').addEventListener('click', restartStage);
      document.getElementById('btnTitle').addEventListener('click', showTitle);
    } else if (G.mode === 'paused') {
      G.mode = 'playing';
      hideOverlay();
    }
  }

  function restartStage() {
    buildStage(G.stageIndex);
    G.hp = maxHp();
    G.mp = maxMp();
    G.mode = 'playing';
    hideOverlay();
    banner(G.stage.name, G.stage.sub);
  }

  function gameOver() {
    G.mode = 'over';
    sfx.die();
    showOverlay(
      '<div class="tag">Game Over</div><h2>你倒下了</h2>' +
      '<p>倒在第 <strong>' + (G.stageIndex + 1) + ' 关 · ' + G.stage.name + '</strong> · <strong>Lv.' + G.level + '</strong></p>' +
      '<p>金币 <strong>' + G.coins + '</strong> · 击杀 <strong>' + G.kills + '</strong> · ' + weaponName() + ' / ' + armorName() + '</p>' +
      '<div class="row">' +
        '<button class="btn" id="btnRetry">重新挑战本关</button>' +
        '<button class="btn ghost" id="btnTitle2">回到标题</button>' +
      '</div>'
    );
    document.getElementById('btnRetry').addEventListener('click', restartStage);
    document.getElementById('btnTitle2').addEventListener('click', showTitle);
  }

  function showWin() {
    G.mode = 'win';
    if (best.stage < STAGES.length) { best.stage = STAGES.length; best.level = Math.max(best.level, G.level); saveBest(); }
    sfx.win();
    showOverlay(
      '<div class="tag">Victory</div><h1>通关！</h1>' +
      '<div class="sub">ADVENTURE KING</div>' +
      '<p>你打穿了全部 <strong>5 关</strong>，成为真正的冒险王。</p>' +
      '<p>等级 <strong>Lv.' + G.level + '</strong> · 金币 <strong>' + G.coins + '</strong> · 击杀 <strong>' + G.kills + '</strong></p>' +
      '<p style="font-size:12px">' + weaponName() + ' · ' + armorName() + '</p>' +
      '<div class="row"><button class="btn" id="btnAgain">再玩一次</button></div>'
    );
    document.getElementById('btnAgain').addEventListener('click', showTitle);
  }

  // ============================================================
  //  输入
  // ============================================================
  var JUMP_KEYS = ['w', 'arrowup', ' '];
  var ATTACK_KEYS = ['j', 'z'];
  var SKILL_KEYS = [['k', '1'], ['l', '2'], [';', '3'], ['o', '4']];

  function activateShield() {
    if (!P || G.mode !== 'playing') return;
    if (P.shieldCd > 0) { toast('护盾冷却 ' + P.shieldCd.toFixed(1) + 's', '#93c5fd'); return; }
    var amount = Math.round(maxHp() * 0.22 + defVal() * 5 + 18);
    P.shieldHP = Math.max(P.shieldHP, amount);
    P.guardT = Math.max(P.guardT, 2.2);
    P.shieldCd = 8.0;
    P.invuln = Math.max(P.invuln, 0.25);
    addNum(P.x + P.w / 2, P.y - 14, '护盾 +' + amount, '#93c5fd', 15);
    spawnParticles(P.x + P.w / 2, P.y + P.h / 2, 12, '#93c5fd', 160);
    addZone({ type: 'nova', x: P.x + P.w / 2, y: P.y + P.h / 2, t: 0.28, max: 0.28, maxR: 70, c1:'#93c5fd', c2:'#bfdbfe' });
    sfx.magic();
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;

    if (k === 'arrowleft' || k === 'arrowright' || k === 'arrowup' || k === 'arrowdown' || k === ' ') {
      e.preventDefault();
    }

    if (k === 'e') {
      if (G.mode === 'merchant' || G.mode === 'bag') { e.preventDefault(); G.mode = 'playing'; hideOverlay(); return; }
      if (G.mode === 'playing' && nearMerchant()) { e.preventDefault(); showMerchantShop(); return; }
    }

    if (k === 'b') {
      if (G.mode === 'bag') { e.preventDefault(); G.mode = 'playing'; hideOverlay(); return; }
      if (G.mode === 'playing' || G.mode === 'merchant') { e.preventDefault(); if (G.mode === 'merchant') hideOverlay(); showBag(); return; }
      return;
    }

    if ((k === 'p' || k === 'escape')) {
      if (G.mode === 'merchant' || G.mode === 'bag') { e.preventDefault(); G.mode = 'playing'; hideOverlay(); return; }
      if (G.mode === 'playing' || G.mode === 'paused') {
        e.preventDefault();
        togglePause();
      }
      return;
    }

    if (G.mode !== 'playing' || !P) return;

    if (k === 's' || k === 'arrowdown') {
      e.preventDefault();
      activateShield();
      return;
    }
    if (JUMP_KEYS.indexOf(k) >= 0) {
      P.jumpBuf = 0.12;
      P.jumpHeld = true;
    }
    if (ATTACK_KEYS.indexOf(k) >= 0) {
      P.attackBuf = 0.16;
      e.preventDefault();
    }
    for (var ski = 0; ski < SKILL_KEYS.length; ski++) {
      if (SKILL_KEYS[ski].indexOf(k) >= 0) {
        P.skillBuf = ski;
        e.preventDefault();
        break;
      }
    }
  });

  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = false;
    if (JUMP_KEYS.indexOf(k) >= 0 && P) P.jumpHeld = false;
  });

  window.addEventListener('blur', function () {
    keys = {};
    if (P) P.jumpHeld = false;
  });

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    if (G.mode === 'playing' && P) P.attackBuf = 0.16;
  });

  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && G.mode === 'playing') togglePause();
  });

  // ============================================================
  //  主循环
  // ============================================================
  var last = performance.now();

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ============================================================
  //  启动
  // ============================================================
  G.cls = 'warrior';
  buildStage(0);
  G.hp = maxHp();
  G.mp = maxMp();
  showTitle();
  requestAnimationFrame(frame);

  // ============================================================
  //  调试接口
  // ============================================================
  window.AK = {
    snapshot: function () {
      return {
        mode: G.mode, cls: G.cls, stage: G.stageIndex + 1, stageName: G.stage ? G.stage.name : '',
        level: G.level, hp: Math.round(G.hp), hpMax: Math.round(maxHp()),
        mp: Math.round(G.mp), mpMax: Math.round(maxMp()),
        coins: G.coins, kills: G.kills,
        x: Math.round(P ? P.x : 0), y: Math.round(P ? P.y : 0),
        onGround: P ? P.onGround : false,
        monsters: M.length, boss: G.boss ? { name: G.boss.name, hp: Math.round(G.boss.hp), maxHp: G.boss.maxHp } : null,
        bossActive: G.bossActive, drops: DR.length,
        weapon: weaponName(), armor: armorName(),
        doubleJump: G.doubleJump, equip: { w: weaponName(), a: armorName() }
      };
    },
    start: startRun,
    stage: function (i) {
      buildStage(i);
      G.hp = maxHp();
      G.mp = maxMp();
      G.mode = 'playing';
      hideOverlay();
    },
    step: update,
    draw: draw,
    playerRef: function () { return P; },
    monstersRef: function () { return M; },
    shotsRef: function () { return PR; },
    bossRef: function () { return G.boss; },
    setPos: function (x, y) { if (P) { P.x = x; if (y !== undefined) P.y = y; } },
    attack: function () { if (P) P.attackBuf = 0.16; },
    jump: function () { if (P) { P.jumpBuf = 0.12; P.jumpHeld = true; } },
    skill: function (i) { if (P) P.skillBuf = (i === undefined ? 0 : i); },
    skills: function () { return cdef().skills; },
    zonesRef: function () { return ZN; },
    hurt: hurtPlayer,
    addCoins: function (n) { G.coins += n; },
    killAll: function () { M.slice().forEach(killMonster); },
    killBoss: function () { if (G.boss) hurtBoss(999999, 1, '#ffffff'); },
    shopItems: shopItems,
    buy: buy,
    next: nextStage,
    title: showTitle,
    togglePause: togglePause
  };

})();
</script>
</body>
</html>
